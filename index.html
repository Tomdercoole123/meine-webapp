async function weekAI(k){
  if(S.gen.wbusy)return;var sample=await getSample();
  if(!sample){toast(unavail());return}
  var w=weekData(k),lines=w.logged.map(function(x){return dateLong(x.k)+': '+Math.round(x.st.k)+' kcal, '+Math.round(x.st.p)+' g Protein, Score '+x.st.score+', '+Math.round(x.st.water)+' ml getrunken. Gegessen: '+x.items.filter(function(i){return !isDrink(i)}).map(function(i){return i.name}).join(', ')}).join('\n');
  var c=calc(S.p,S.p.perMonth);
  S.gen.wbusy=k;render();
  try{
    var r=await sample('Du bist die ruhige, sachliche Essens-KI der App Mahlzeit. Schreibe ein Wochenfazit auf Deutsch in höchstens 5 kurzen Sätzen: was gut lief, was besser sein kann, ein konkreter Tipp für die nächste Woche. Kein Markdown, keine Listenzeichen. Zielwerte pro Tag: '+Math.round(c.target)+' kcal, '+Math.round(c.P)+' g Protein, '+waterGoal(S.p)+' ml Flüssigkeit. Der Score geht von 1 bis 100, 100 ist am besten.\n\nWoche KW '+isoWeek(w.start)+':\n'+lines,{cache:false});
    S.weekAI[k]=String(r.text||'').trim();save();
  }catch(e){toast(errCopy(e))}
  finally{S.gen.wbusy='';if(S.view==='history')render()}
}

function histSeg(){
  var cur=S.hview||'food';
  return '<div class="seg pad" role="tablist">'+[['food','Essen'],['train','Training'],['weight','Gewicht'],['photo','Fotos']].map(function(x){return '<button type="button" role="tab" class="'+(cur===x[0]?'on':'')+'" data-act="hview" data-v="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
}
function wEntries(){
  return Object.keys(S.wlog).sort().map(function(k){return {k:k,v:+S.wlog[k]}}).filter(function(e){return isFinite(e.v)});
}
function fkg(v){return (Math.round(v*10)/10).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})}
function weightChart(es){
  if(es.length<2)return '<p class="hint" style="margin:0">Mit zwei Einträgen siehst du hier deine Kurve.</p>';
  var W=520,H=220,L=46,R=10,T=14,B=28,pw=W-L-R,ph=H-T-B,t0=parseKey(es[0].k).getTime(),t1=parseKey(es[es.length-1].k).getTime(),span=Math.max(t1-t0,6*864e5);
  var vs=es.map(function(e){return e.v}),tw=+S.p.tw||null,lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  if(tw&&tw>lo-6&&tw<hi+6){lo=Math.min(lo,tw);hi=Math.max(hi,tw)}
  lo=Math.floor(lo-.8);hi=Math.ceil(hi+.8);
  var x=function(k){return L+(parseKey(k).getTime()-t0)/span*pw},y=function(v){return T+ph-(v-lo)/(hi-lo)*ph};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gewichtsverlauf">';
  [0,.5,1].forEach(function(f){var v=lo+(hi-lo)*f,yy=y(v);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="ax" x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+fkg(v)+'</text>'});
  if(tw&&tw>=lo&&tw<=hi)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(tw)+'" y2="'+y(tw)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>';
  s+='<path d="M'+es.map(function(e){return x(e.k).toFixed(1)+' '+y(e.v).toFixed(1)}).join('L')+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  es.forEach(function(e){s+='<circle cx="'+x(e.k).toFixed(1)+'" cy="'+y(e.v).toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface2)" stroke-width="2"/>'});
  s+='<text class="ax" x="'+L+'" y="'+(H-8)+'">'+dmy(parseKey(es[0].k))+'</text><text class="ax" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+dmy(parseKey(es[es.length-1].k))+'</text></svg>';
  return '<div class="chartbox">'+s+'</div><div class="legend"><span><i style="background:var(--accent)"></i>Dein Gewicht</span>'+(tw&&tw>=lo&&tw<=hi?'<span><i class="ln"></i>Zielgewicht</span>':'')+'</div>';
}
function weightHtml(){
  var es=wEntries(),last=es[es.length-1],start=S.w0?+S.w0:(es[0]?es[0].v:null),tw=+S.p.tw||null,cur=last?last.v:+S.p.weight;
  var diff=(start!=null&&last)?last.v-start:null;
  var cell=function(l,b,s){return '<div class="stat"><small>'+l+'</small><b>'+b+'</b><span>'+(s||'&nbsp;')+'</span></div>'};
  var rest=tw?cur-tw:null;
  var h='<div class="card wcard"><h3 style="margin:0 0 4px">Gewicht eintragen</h3><p class="sub" style="margin:0 0 12px">Trag dein Gewicht ein, zum Beispiel morgens nach dem Aufstehen. Deine Ziele werden mit dem neuesten Wert berechnet.</p>'+
   '<div class="wform"><label class="lf"><small>Gewicht in kg</small><input id="wkg" type="text" inputmode="decimal" autocomplete="off" placeholder="'+(isFinite(cur)?fkg(cur).replace('.',','):'z. B. 80,5')+'" maxlength="6"></label>'+
   '<label class="lf"><small>Datum</small><input id="wdate" type="date" max="'+keyOf(today(0))+'" value="'+keyOf(today(0))+'"></label></div>'+
   (S.wmsg?'<div class="err" style="margin-top:10px">'+esc(S.wmsg)+'</div>':'')+
   '<button type="button" class="btn pri full" style="margin-top:12px" data-act="wsave">Speichern</button></div>';
  h+='<div class="stats">'+cell('Aktuell',isFinite(cur)?fkg(cur)+' kg':'–',last?'am '+dmy(parseKey(last.k)):'laut deinen Angaben')+cell('Start',start!=null?fkg(start)+' kg':'–','Beginn')+cell('Veränderung',diff==null?'–':(diff>0?'+':'')+fkg(diff)+' kg','seit dem Start')+cell('Zielgewicht',tw?fkg(tw)+' kg':'–',rest==null?'nicht gesetzt':Math.abs(rest)<.05?'erreicht':'noch '+fkg(Math.abs(rest))+' kg')+'</div>';
  h+='<section class="sec"><h2>Verlauf</h2>'+weightChart(es)+'</section>';
  if(es.length)h+='<section class="sec"><h2>Einträge</h2><div class="card" style="padding:4px 14px">'+es.slice().reverse().slice(0,30).map(function(e){return '<div class="wrow"><span>'+esc(dateLong(e.k))+'</span><b>'+fkg(e.v)+' kg</b><button type="button" class="wdel" data-act="wdel" data-k="'+e.k+'" aria-label="Eintrag vom '+esc(dateLong(e.k))+' löschen">×</button></div>'}).join('')+'</div></section>';
  return h;
}
function saveWeight(){
  var el=document.getElementById('wkg'),de=document.getElementById('wdate');if(!el)return;
  var v=parseFloat(String(el.value).replace(',','.')),k=(de&&de.value)||keyOf(today(0));
  if(!isFinite(v)||v<25||v>400){S.wmsg='Bitte gib ein Gewicht zwischen 25 und 400 kg ein, zum Beispiel 80,5.';render();return}
  if(k>keyOf(today(0))){S.wmsg='Das Datum darf nicht in der Zukunft liegen.';render();return}
  S.wmsg='';
  if(!S.w0)S.w0=String(S.p.weight);
  v=Math.round(v*10)/10;S.wlog[k]=v;
  var es=wEntries(),last=es[es.length-1];
  if(last)S.p.weight=String(last.v);
  save();render();toast('Gewicht gespeichert');phGoalCheck();
}
function delWeight(k){
  delete S.wlog[k];var es=wEntries();if(es.length)S.p.weight=String(es[es.length-1].v);
  save();render();
}

function musName(k){var m=MUS.filter(function(x){return x[0]===k})[0];return m?m[1]:k}
var SPD=null;
function splitOf(){return S.train.split||(S.train.split={})}
function splitHtml(){
  var sp=splitOf();
  return '<div id="tsplit" class="splitlist">'+DAYS.map(function(d){
    var v=sp[d[0]]||[],open=SPD===d[0];
    var chips=v.length?v.map(function(m){return '<span class="mchip'+(m==='rest'?' rest':'')+'">'+esc(musName(m).replace(/ \(.*\)/,''))+'</span>'}).join(''):'<span class="mnone">Antippen zum Auswählen</span>';
    var panel=open?'<div class="mpanel"><p class="hint" style="margin:0 0 8px">'+v.length+' von 4 gewählt</p><div class="mgrid">'+MUS.map(function(m,i){var on=v.indexOf(m[0])>-1,dis=!on&&m[0]!=='rest'&&v.length>=4&&v.indexOf('rest')<0;return '<button type="button" class="mu-o'+(on?' sel':'')+(m[0]==='rest'?' wide':'')+'" data-act="tmus" data-d="'+d[0]+'" data-v="'+m[0]+'" aria-pressed="'+on+'"'+(dis?' disabled':'')+'><i>'+(i+1)+'</i>'+esc(m[1])+'</button>'}).join('')+'</div></div>':'';
    return '<div class="sday'+(open?' open':'')+(v.length?' done':'')+'"><button type="button" class="shead" data-act="tday" data-d="'+d[0]+'" aria-expanded="'+open+'"><b>'+d[1]+'</b><span class="mchips">'+chips+'</span></button>'+panel+'</div>';
  }).join('')+'</div>';
}
function updateSplit(){
  var el=document.getElementById('tsplit');if(!el)return;
  var tmp=document.createElement('div');tmp.innerHTML=splitHtml();el.innerHTML=tmp.firstChild.innerHTML;
  var nx=document.getElementById('tnext');if(nx)nx.disabled=!tAnswered(tqList()[S.train.step]);
}
function tqList(){return TQ.filter(function(q){return !q.cond||q.cond()})}
function tAnswered(q){if(q.split){var sp=S.train.split||{};return DAYS.every(function(d){return sp[d[0]]&&sp[d[0]].length>0})}var v=S.train[q.k];return q.optional?true:q.multi?(v&&v.length>0):!!v}
function tLabel(q){
  var v=S.train[q.k];
  if(q.split){var sp=S.train.split||{};return DAYS.map(function(d){return d[1].slice(0,2)+': '+(sp[d[0]]||[]).map(function(m){return musName(m).replace(/ \(.*\)/,'')}).join(', ')}).join(' · ')}
  if(q.search)return v&&v.length?v.join(', '):'Keine';
  if(q.multi)return (v||[]).map(function(x){var o=q.o.filter(function(y){return y[0]===x})[0];return o?o[1]:x}).join(', ')||'–';
  var o=q.o.filter(function(x){return x[0]===String(v)})[0];return o?o[1]+(o[2]?' ('+o[2]+')':''):'–';
}
function topt(q,o){
  var v=S.train[q.k],sel=q.multi?(v||[]).indexOf(o[0])>-1:v===o[0];
  return '<button type="button" class="opt'+(sel?' sel':'')+'" data-act="tpick" data-k="'+q.k+'" data-v="'+o[0]+'" aria-pressed="'+sel+'"><b>'+o[1]+'</b>'+(o[2]?'<small>'+o[2]+'</small>':'')+'</button>';
}
/* Übungen ausschließen: Suchfeld mit Mehrfachauswahl */
function avoidHtml(){
  var A=S.train.avoid||[],q=(S.train.q||'').trim().toLowerCase();
  var list=(q?EXERCISES.filter(function(x){return x.toLowerCase().indexOf(q)>-1}):EXERCISES.slice(0,8)).slice(0,10);
  var exact=EXERCISES.some(function(x){return x.toLowerCase()===q})||A.some(function(x){return x.toLowerCase()===q});
  var sel=A.length?'<div class="chips" style="margin-bottom:12px">'+A.map(function(x){return '<button type="button" class="chip on" data-act="tavoid" data-v="'+esc(x)+'" aria-label="'+esc(x)+' entfernen">'+esc(x)+' ×</button>'}).join('')+'</div>':'<p class="hint" style="margin:0 0 12px">Noch nichts ausgewählt.</p>';
  var rows='<div class="list" style="margin-top:0">'+list.map(function(x){var on=A.indexOf(x)>-1;return '<button type="button" class="row" data-act="tavoid" data-v="'+esc(x)+'" aria-pressed="'+on+'"><b>'+esc(x)+'</b><em>'+(on?'Ausgewählt':'Auswählen')+'</em></button>'}).join('')+(q.length>=3&&!exact?'<button type="button" class="row" data-act="tcustom"><b>„'+esc(S.train.q.trim())+'“ hinzufügen</b><em>Eigene Übung</em></button>':'')+(!list.length&&q.length<3?'<p class="hint">Nichts gefunden.</p>':'')+'</div>';
  return '<div id="tsel">'+sel+'</div><input class="text" id="tsearch" type="text" autocomplete="off" maxlength="40" placeholder="Übung suchen, z. B. Kniebeugen" value="'+esc(S.train.q||'')+'"><div id="tres" style="margin-top:10px">'+rows+'</div>';
}
function updateAvoid(){

/* Mango springt von Frage zu Frage */
var TRK={};
function eagleTrack(key,step,total){
  var pct=total>1?step/(total-1)*100:0,from=TRK[key]!==undefined?TRK[key]:pct;TRK[key]=pct;
  var dots='';if(total<=10)for(var i=0;i<total;i++){var p=i/(total-1)*100;dots+='<i class="et-dot'+(i<=step?' on':'')+'" style="left:'+p+'%"></i>'}
  return '<div class="etrack" data-from="'+from+'" data-to="'+pct+'" aria-hidden="true"><div class="et-line"><i style="width:'+from+'%"></i></div>'+dots+'<div class="et-bird" style="left:'+from+'%"><div class="et-in">'+eagle({crop:true})+'</div></div></div>';
}
function animTrack(){
  var t=document.querySelector('.etrack');if(!t)return;
  var from=+t.dataset.from,to=+t.dataset.to,bird=t.querySelector('.et-bird'),fill=t.querySelector('.et-line i');
  if(from===to)return;
  requestAnimationFrame(function(){requestAnimationFrame(function(){bird.style.left=to+'%';fill.style.width=to+'%';bird.classList.add('hop')})});
}
function renderTrain(){
  var T=S.train,L=tqList();
  if(T.done){var miss=L.map(tAnswered).indexOf(false);if(miss>-1){T.done=false;T.step=miss}}
  if(T.step>=L.length)T.step=L.length-1;
  if(T.done){renderTrainHome();return}
  var q=L[T.step],last=T.step===L.length-1;
  if(q.split&&SPD===null&&!tAnswered(q))SPD=null;
  var body=q.split?splitHtml():q.search?avoidHtml():'<div class="'+(q.grid?'grid2':'stack')+'">'+q.o.map(function(o){return topt(q,o)}).join('')+'</div>';
  app.innerHTML=topbar({count:'Frage '+(T.step+1)+' von '+L.length})+eagleTrack('train',T.step,L.length)+
   '<div class="coach"><div class="eg">'+eagle()+'</div><div class="bubble"><h1>'+esc(q.t)+'</h1></div></div>'+
   '<section class="card"><p class="sub">'+esc(q.s)+'</p>'+body+'</section>'+
   '<nav class="nav"><button type="button" class="btn" data-act="tback">Zurück</button><button type="button" class="btn pri" id="tnext" data-act="tnext"'+(tAnswered(q)?'':' disabled')+'>'+(last?'Fertig':'Weiter')+'</button></nav>';
  animTrack();
}

    S.tchanges=(S.tchanges||0)+1;S.tlimit=false;save();
  }
  var sample=await getSample();g.err='';var noAI=!sample;
  var days=trainDays();if(!days.length){g.err='Du hast keinen Trainingstag gewählt.';render();return}
  var pl=(onlyMissing&&S.tplan)?S.tplan:{start:keyOf(today(0)),sig:sigOf(),sessions:{},ov:null,ts:Date.now()};
  S.tplan=pl;pl.sig=sigOf();
  var jobs=[];
  if(!pl.ov)jobs.push({ov:true});
  days.forEach(function(d){if(!pl.sessions[d])jobs.push({d:d})});
  // Tage, die nicht mehr im Wochenplan sind, entfernen
  Object.keys(pl.sessions).forEach(function(k){if(days.indexOf(k)<0)delete pl.sessions[k]});
  if(!jobs.length){save();render();return}
  g.busy=true;g.total=jobs.length;g.done=0;g.fail=0;g.local=0;render();
  var so={cache:false};if(sample&&sample.shim)so.mode='train';
  async function run(j){
    if(noAI){var f0=j.ov?localOverview():localSession(j.d);if(f0){if(j.ov)pl.ov=f0;else pl.sessions[j.d]=f0;g.local=(g.local||0)+1;save();return true}g.lastErr={code:'none'};return false}
    for(var a=0;a<3;a++){
      try{
        var o=await sample.json(j.ov?overviewPrompt():sessionPrompt(j.d),so);
        if(j.ov){var ov=normOverview(o);if(!ov)throw {code:'invalid_json'};pl.ov=ov}
        else{var s=normSession(o,j.d);if(!s)throw {code:'invalid_json'};pl.sessions[j.d]=s}
        save();return true;
      }catch(e){
        if(aiDown(e)||a===2){
          var fb=j.ov?localOverview():localSession(j.d);
          if(fb){if(j.ov)pl.ov=fb;else pl.sessions[j.d]=fb;g.local=(g.local||0)+1;g.lastErr=e;save();return true}
          g.lastErr=e;return false}
        await new Promise(function(r){setTimeout(r,1500*(a+1))})}
    }
  }
  var idx=0;
  async function worker(){while(idx<jobs.length){var j=jobs[idx++],ok=await run(j);g.done++;if(!ok)g.fail++;if(S.view==='train')render()}}
  try{await Promise.all([worker(),worker()])}
  finally{
    g.busy=false;
    if(g.fail)g.err=errCopy(g.lastErr)+' '+g.fail+' Teil(e) fehlen noch.';
    else if(g.local&&noAI)g.err='Die KI ist noch nicht eingerichtet. Dein Plan wurde deshalb aus der geprüften Übungsliste erstellt (passend zu Ort, Geräten, Level und Dauer, aber ohne persönliche Erklärungen). Sobald dein KI-Server steht, kannst du ihn in den Einstellungen neu erstellen lassen.';
    else if(g.local)g.err=g.local+' Teil(e) hat die KI nicht brauchbar beantwortet (Grund: '+errCopy(g.lastErr).replace(/\.$/,'')+'). Sie wurden stattdessen aus der geprüften Übungsliste erstellt. Über Einstellungen kannst du den Plan neu erstellen, dann versucht es die KI noch einmal.';
    save();if(S.view==='train')render();
  }
}

function calInfo(key){
  var pl=S.tplan,dk=DAYS[dayIdx(parseKey(key))][0],v=(S.train.split||{})[dk]||[];
  return {dk:dk,rest:v.indexOf('rest')>-1,s:pl.sessions[dk],mus:v};
}
function phaseFor(wk){
  var ov=S.tplan.ov;if(!ov)return null;var cw=((wk-1)%6)+1;
  for(var i=0;i<ov.ph.length;i++){var m=String(ov.ph[i].w).match(/\d+/g)||[];var a=+m[0],b=+(m[1]||m[0]);if(cw>=a&&cw<=b)return ov.ph[i]}
  return null;
}
function calHtml(){
  var pl=S.tplan,st=parseKey(pl.start),off=dayIdx(st),tk=keyOf(today(0)),sel=S.tsel||tk;

  }
  for(var q=0;q<=Math.max(idx,0);q++){var dd=new Date(parseKey(tk));dd.setDate(dd.getDate()-q);var kk=keyOf(dd);if(kk<pl.start)break;var ii=calInfo(kk);if(ii.rest||!ii.s)continue;if(S.tdone[kk])curStreak++;else if(kk<tk)break}
  var curW=Math.floor((Math.max(idx,0)+off)/7),w0=S.tall?0:Math.max(0,curW-11),w1=curW+4+(S.tmore||0)*4;

      var d=new Date(st);d.setDate(d.getDate()+n);var k=keyOf(d),inf=calInfo(k),isT=k===tk,past=k<tk,dn=!!S.tdone[k];
      var pln=!inf.rest&&inf.mus.length&&inf.s;
      if(pln){wp++;if(dn)wd++}

      rowc+='<button type="button" class="'+cl+'" data-act="tcal" data-k="'+k+'" aria-label="'+esc(dateLong(k))+(pln?', Training':inf.rest?', Ruhetag':'')+(dn?', erledigt':'')+'"><span>'+d.getDate()+'</span>'+(dn?'<em>✓</em>':'')+'</button>';

  var inRange=idx>=0,wk=Math.floor(Math.max(idx,0)/7)+1,ph=inRange?phaseFor(wk):null,blk=Math.floor((wk-1)/6)+1,bw=((wk-1)%6)+1;
  var top='<div class="stats"><div class="stat"><small>Erledigt</small><b>'+done+' von '+planned+'</b><span>geplante Einheiten bis heute</span></div><div class="stat"><small>Quote</small><b>'+(planned?Math.round(done/planned*100):0)+' %</b><span>Serie '+curStreak+' in Folge</span></div><div class="stat"><small>Verbrannt</small><b>ca. '+fmt(kc)+' kcal</b><span>durchs Training, geschätzt</span></div><div class="stat"><small>Aktuell</small><b>'+(inRange?'Woche '+wk:'Startet bald')+'</b><span>'+(inRange?'seit '+dmy(st):'&nbsp;')+'</span></div></div>';
  var leg='<div class="legend"><span><i class="lg pl"></i>Training</span><span><i class="lg dn"></i>Erledigt</span><span><i class="lg rs"></i>Ruhetag</span><span><i class="lg ms"></i>Verpasst</span></div>';

      if(inf2.rest)det+='<p class="sub" style="margin:10px 0 0">Ruhetag. Deine Muskeln wachsen in der Pause. Schlafe genug und bewege dich locker, wenn du magst.</p>';

      }
      det+='</div>';

  }
  return '<p class="sub" style="margin:0 0 12px">Jede Zeile ist eine Woche. Tippe auf einen Tag, um die Einheit zu sehen und abzuhaken. Der Plan läuft ohne festes Ende weiter, solange du Premium hast. Gestartet am '+dmy(st)+'</p>'+top+cells+leg+det;

function xeAct(act,t){
  var s=xeSess();if(!s&&act!=='xeopen'&&act!=='xeself')return;
  var i=+t.dataset.i,v=t.dataset.v,fy=window.scrollY;
  switch(act){
    case 'xeopen':xeOpen(curDay());return;
    case 'xeself':xeSelf(curDay());return;
    case 'xedone':XE={dk:null,pick:null,q:'',mus:'',all:false};render();window.scrollTo(0,fy);return;
    case 'xesets':{var e=s.ex[i];if(e){e.sets=clamp(e.sets+(+v),1,3);xeSave(s)}break}
    case 'xemove':{var j=i+(+v);if(s.ex[i]&&s.ex[j]){var tmp=s.ex[i];s.ex[i]=s.ex[j];s.ex[j]=tmp;xeSave(s)}break}
    case 'xedel':s.ex.splice(i,1);xeSave(s);break;
    case 'xedelc':s.cardio=null;xeSave(s);break;
    case 'xeswap':XE.pick={i:i,cardio:false};XE.q='';XE.mus='';break;
    case 'xeswapc':XE.pick={i:-1,cardio:true,swap:true};XE.q='';XE.mus='';break;
    case 'xeadd':XE.pick={i:-1,cardio:false};XE.q='';XE.mus='';break;
    case 'xeaddc':XE.pick={i:-1,cardio:true};XE.q='';XE.mus='';break;
    case 'xeclose':XE.pick=null;break;
    case 'xemus':XE.mus=v||'';xeRefresh(s);return;
    case 'xeall':XE.all=!!t.checked;xeRefresh(s);return;
    case 'xepickex':{
      var lib=EXBYN[String(v).toLowerCase()];if(!lib)return;var P=XE.pick;
      if(P.cardio){s.cardio={n:lib.n,min:(s.cardio&&s.cardio.min)||20,ints:'',aufbau:'Gleichmäßiges Tempo, bei dem du dich noch unterhalten kannst.'}}

      XE.pick=null;xeSave(s);break}

}

var EAN_PAR=['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];
function eanCheck(s){var n=s.length,sum=0;for(var i=0;i<n-1;i++){var d=+s[n-2-i];sum+=d*(i%2===0?3:1)}return (10-sum%10)%10===+s[n-1]}
function eanDigit(w,tables){
  var T=w[0]+w[1]+w[2]+w[3];if(T<=0)return null;var best=null,be=9;
  for(var t=0;t<tables.length;t++)for(var d=0;d<10;d++){
    var pat=tables[t]==='G'?EAN_L[d].slice().reverse():EAN_L[d],e=0;
    for(var k=0;k<4;k++)e+=Math.abs(w[k]*7/T-pat[k]);
    if(e<be){be=e;best={d:d,t:tables[t],e:e}}

}
function eanAt(runs,s,half){
  var n=half?4:6,need=3+n*4+5+n*4+3;if(s+need>runs.length)return null;
  var g=[runs[s],runs[s+1],runs[s+2]],u=(g[0]+g[1]+g[2])/3;
  for(var i=0;i<3;i++)if(g[i]<u*.5||g[i]>u*1.7)return null;
  var pos=s+3,digs=[],par='';
  for(var a=0;a<n;a++){var w=runs.slice(pos,pos+4),T=w[0]+w[1]+w[2]+w[3];if(T/u<5||T/u>9)return null;var r=eanDigit(w,half?['L']:['L','G']);if(!r)return null;digs.push(r.d);par+=r.t;pos+=4}
  var mid=runs.slice(pos,pos+5),ms=mid.reduce(function(x,y){return x+y},0);if(ms/u<3.5||ms/u>7)return null;pos+=5;
  for(var b=0;b<n;b++){var w2=runs.slice(pos,pos+4),T2=w2[0]+w2[1]+w2[2]+w2[3];if(T2/u<5||T2/u>9)return null;var r2=eanDigit(w2,['L']);if(!r2)return null;digs.push(r2.d);pos+=4}

function eanRuns(runs,dark0){

}
function eanRow(gray,w,y){
  var row=new Array(w),i,mn=255,mx=0;
  for(i=0;i<w;i++){var v=gray[y*w+i];row[i]=v}
  var sorted=row.slice().sort(function(a,b){return a-b}),lo=sorted[Math.floor(w*.08)],hi=sorted[Math.floor(w*.92)];
  if(hi-lo<40)return null;var th=(lo+hi)/2,runs=[],cur=row[0]<th,len=1;
  for(i=1;i<w;i++){var d=row[i]<th;if(d===cur)len++;else{runs.push(len);len=1;cur=d}}
  runs.push(len);if(runs.length<45)return null;
  var dark0=row[0]<th?0:1,c=eanRuns(runs,dark0);if(c)return c;
  var rev=runs.slice().reverse(),dr=(runs.length-1-dark0)%2===0?0:1;

  var lastDark=((runs.length-1)%2===dark0%2)?0:1;

function decodeEANImage(img){

  var fr=[.5,.45,.55,.4,.6,.35,.65,.3,.7,.25,.75,.2,.8,.15,.85,.1,.9];
  for(var k=0;k<fr.length;k++){var c=eanRow(gray,w,Math.min(h-1,Math.floor(h*fr[k])));if(c)return c}

/* Produktdaten von Open Food Facts */
async function bcLookup(code){
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},12000),r;
  try{r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,product_name_de,brands,nutriments,serving_quantity,nutriscore_grade',{signal:ctl.signal})}
  catch(e){clearTimeout(tm);throw {code:'network'}}
  clearTimeout(tm);
  var j=null;try{j=await r.json()}catch(e){}
  if(!j||j.status===0||!j.product)throw {code:'notfound'};
  var p=j.product,n=p.nutriments||{},kcal=n['energy-kcal_100g'];
  if(kcal==null&&n['energy_100g']!=null)kcal=n['energy_100g']/4.184;
  if(kcal==null||!isFinite(+kcal))throw {code:'nonut'};
  var pr=+n.proteins_100g||0,ch=+n.carbohydrates_100g||0,fa=+n.fat_100g||0,name=String(p.product_name_de||p.product_name||'Produkt '+code),br=String(p.brands||'').split(',')[0].trim();
  if(br&&name.toLowerCase().indexOf(br.toLowerCase())<0)name=br+' '+name;
  var ns={a:90,b:75,c:55,d:35,e:15}[String(p.nutriscore_grade||'').toLowerCase()],g=+p.serving_quantity>0?Math.round(+p.serving_quantity):100;
  return {name:name.slice(0,60),g:g,pk:+kcal/100,pp:pr/100,pc:ch/100,pf:fa/100,sc:ns!=null?ns:heurScore(+kcal,pr,ch,fa,100)};
}

}

async function camStart(){
  var me=CAM;if(!me)return;

  if(!window.isSecureContext&&location.protocol!=='file:'){camSet('error',camErr({code:'insecure'}).t,false);return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camSet('error',camErr({code:'noapi'}).t);return}
  camSet('start','Kamera wird geöffnet … Wenn dein Browser fragt, tippe auf „Erlauben“.');
  var tries=[{video:{facingMode:{ideal:me.facing},width:{ideal:1920},height:{ideal:1080}},audio:false},{video:true,audio:false}],stream=null,err=null;
  for(var i=0;i<tries.length&&!stream;i++){
    try{stream=await Promise.race([navigator.mediaDevices.getUserMedia(tries[i]),new Promise(function(_,rej){setTimeout(function(){rej({code:'timeout',name:'Timeout'})},20000)})])}
    catch(e){err=e;if(!(e&&(e.name==='OverconstrainedError'||e.name==='ConstraintNotSatisfiedError'||e.name==='TypeError')))break}
  }
  if(CAM!==me){if(stream)stream.getTracks().forEach(function(t){t.stop()});return}
  if(!stream){var ce=camErr(err);camSet('error',ce.t,ce.help);return}
  me.stream=stream;
  var v=me.el.querySelector('video');v.srcObject=stream;
  try{await v.play()}catch(e){}

  while(!v.videoWidth&&Date.now()-t0<5000){await new Promise(function(r){setTimeout(r,80)});if(CAM!==me)return}
  if(!v.videoWidth){camStopStream();camSet('error','Die Kamera liefert kein Bild. Versuche es noch einmal.',false);return}

    me.timer=setInterval(async function(){
      if(busy||!CAM||CAM!==me||me.state!=='live'||!v.videoWidth)return;busy=true;var c=null;

function camShot(){
  var me=CAM;if(!me||me.state!=='live')return;

    if(CAM!==me)return;

/* Vier Quests pro Tag, fest nach Datum und Spieler gewürfelt: drei Aufgaben mit Daten, eine zum Entdecken der App */
function arQuests(k){

  var base=arBase(td).sum;

  else if(base!==a.snap.v){if(base>a.snap.v&&a.boostUntil>now)a.bonus[td]=(a.bonus[td]||0)+(base-a.snap.v);a.snap.v=base;ch=true}

var ARB=[[250,120],[420,150],[640,190],[900,240],[1220,300],[1600,380]];
function arBot(tid,j,league,wk,nowTs){

      base=ARB[league][0]+(r()*2-1)*ARB[league][1],ep=0,d0=parseKey(wk),now=nowTs||Date.now();

        v=Math.max(0,Math.round(base/7*(.35+rw()*1.3)/5)*5),f=clamp((now-day)/86400000,0,1);
    ep+=Math.round(v*Math.min(1,f*1.15)/5)*5;

function arTable(wk,league,tid,humans,myEP){
  var a=S.arena,rows=[{id:a.pid,name:a.name,ep:myEP,me:true}],seen={};seen[a.pid]=1;
  (humans||[]).forEach(function(h){if(h&&h.id&&!h.me&&!seen[h.id]&&rows.length<10){seen[h.id]=1;rows.push({id:h.id,name:String(h.name||'Spieler').slice(0,16),ep:+h.ep||0,human:true})}});
  var j=0,used={};while(rows.length<10&&j<40){var b=arBot(tid,j,league,wk);j++;if(used[b.name]||rows.some(function(x){return x.name===b.name}))continue;used[b.name]=1;rows.push(b)}

  rows.forEach(function(x){if(x.bot)x.ep=arBot(tid,+x.id.slice(1),league,wk,now).ep});
  rows.sort(function(p,q){return q.ep-p.ep||(p.me?1:0)-(q.me?1:0)||(p.bot?1:0)-(q.bot?1:0)});

  case 'dishlog':var d=(S.plans[S.day]||{dishes:[]}).dishes[+t.dataset.i];if(d){addItem(mapMeal(d.slot),d.name,null,d.kcal,d.protein,d.carbs,d.fett,d.score);toast('Eingetragen: '+d.name);render()}break;
  case 'openmeal':openSheet(t.dataset.m,'menu');break;
  case 'openrecipe':openSheet(null,'recipes');break;
  case 'openchat':go('ai');break;
  case 'gotoai':closeSheet();go('ai');break;
  case 'hmetric':S.hist.metric=t.dataset.v;render();break;
  case 'hrange':S.hist.range=+t.dataset.v;render();break;
  case 'htable':S.hist.table=!S.hist.table;render();break;
  case 'toggleweek':S.hist.opened[t.dataset.k]=!S.hist.opened[t.dataset.k];render();break;
  case 'weekai':weekAI(t.dataset.k);break;
  case 'weeksToggle':S.hist.weeksOpen=!S.hist.weeksOpen;render();break;
  case 'openweek':S.hist.weeksOpen=true;S.hist.opened[t.dataset.k]=true;S.hview='food';go('history');break;
  case 'aiclear':S.aichat.msgs=[];save();render();break;
  case 'delitem':e.stopPropagation();var key=keyOf(today(0));S.log[key]=(S.log[key]||[]).filter(function(x){return x.id!==t.dataset.id});save();render();break;
  case 'closesheet':closeSheet();break;
  case 'sheetback':
    if(!sh)break;
    if(sh.view==='weight')sh.view='search';
    else if(sh.view==='search')sh.view=sh.ing?'recipenew':'menu';
    else if(sh.view==='recipenew'){sh.ing=false;sh.view='recipes'}
    else if(sh.view==='recweight')sh.view='recipes';
    else sh.view='menu';
    renderSheet();break;
  case 'goview':if(sh){sh.view=t.dataset.v;renderSheet()}break;
  case 'mealsel':if(sh){sh.mealSel=t.dataset.v;document.querySelectorAll('[data-act=mealsel]').forEach(function(b){b.classList.toggle('on',b.dataset.v===sh.mealSel)})}break;
  case 'pickfood':if(sh){sh.food=FOODS.filter(function(f){return f.name===t.dataset.n})[0];sh.g=sh.food.u?sh.food.u:100;sh.view='weight';renderSheet()}break;
  case 'aiest':aiEstimate();break;
  case 'setg':if(sh){sh.g=t.dataset.g;var gi=document.getElementById('g');if(gi)gi.value=sh.g;updateWprev()}break;
  case 'addfood':
    if(!sh)break;var g=num(sh.g);if(!(g>0)){toast('Bitte ein Gewicht eingeben');break}var f=sh.food;
    if(sh.ing){sh.recipe.ings.push({name:f.name,g:g,s:foodScore(f),k:f.k*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100});sh.ing=false;sh.view='recipenew';renderSheet();break}
    var bi={meal:sh.mealSel,name:f.name,g:g,k:f.k*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100,s:foodScore(f)};if(sh.photo){bi.ph=sh.photo;sh.photo=null}sh.basket.push(bi);toast('In der Auswahl: '+f.name);sh.q='';sh.view='search';renderSheet();break;
  case 'recnew':if(sh){sh.recipe={name:'',portions:'2',ings:[]};sh.view='recipenew';renderSheet()}break;
  case 'recaddingr':if(sh){sh.ing=true;sh.q='';sh.view='search';renderSheet()}break;
  case 'recdeling':if(sh){sh.recipe.ings.splice(+t.dataset.i,1);renderSheet()}break;
  case 'recsave':
    if(!sh)break;var r=sh.recipe,tot=sums(r.ings),po=Math.max(1,Math.round(num(r.portions)||1));
    S.recipes.push({id:uid(),name:r.name.trim(),portions:po,score:avgScore(r.ings),per:{k:tot.k/po,p:tot.p/po,c:tot.c/po,f:tot.f/po}});save();toast('Rezept gespeichert');sh.view='recipes';renderSheet();break;
  case 'recdel':if(sh){S.recipes.splice(+t.dataset.i,1);save();renderSheet()}break;
  case 'recuse':if(sh){sh.rec=S.recipes[+t.dataset.i];sh.por='1';sh.view='recweight';renderSheet()}break;
  case 'addrec':
    if(!sh)break;var po2=num(sh.por||'1');if(!(po2>0)){toast('Bitte Portionen eingeben');break}var rc=sh.rec;
    sh.basket.push({meal:sh.mealSel,name:rc.name+(po2!==1?' ('+po2.toLocaleString('de-DE')+' Portionen)':''),g:null,k:rc.per.k*po2,p:rc.per.p*po2,c:rc.per.c*po2,f:rc.per.f*po2,s:rc.score});toast('In der Auswahl: '+rc.name);sh.view='menu';renderSheet();break;
  case 'phclear':if(sh){sh.photo=null;renderSheet()}break;
  case 'scangal':var gsh=S.sheet,gid=t.dataset.i;camPick({title:gid==='bcfileg'?'Barcode aus der Galerie':'Foto vom Essen',onUse:function(f){if(gid==='bcfileg')scanBcFile(f,gsh);else scanFoodFile(f,gsh)}});break;
  case 'scanfood':camAsk(openFoodCam);break;
  case 'scanbc':camAsk(openBcCam);break;
  case 'bcstop':if(sh){stopCam();sh.scan.status='idle';sh.scan.err='';renderScan()}break;
  case 'bcreset':if(sh){stopCam();sh.scan={status:'idle',items:[],err:'',preview:'',hint:''};renderScan()}break;
  case 'bcgo':if(sh){var bn=document.getElementById('bcnum'),bv=bn?bn.value.replace(/\s/g,''):'';if(!/^\d{8,14}$/.test(bv)){sh.scan.status='error';sh.scan.err='Die Nummer hat 8 bis 14 Ziffern. Prüfe die Zahl unter dem Barcode.';renderScan();break}bcHandle(bv)}break;
  case 'scandel':if(sh){sh.scan.items.splice(+t.dataset.i,1);renderScan()}break;
  case 'scanadd':
    if(!sh)break;sh.scan.items.forEach(function(i){var g=num(i.g)||0;if(g>0)sh.basket.push({meal:sh.mealSel,name:i.name,g:g,k:i.pk*g,p:i.pp*g,c:i.pc*g,f:i.pf*g,s:i.sc})});toast('In der Auswahl');sh.scan={status:'idle',items:[],err:'',preview:'',hint:''};sh.view='menu';renderSheet();break;
  case 'bdel':if(sh){sh.basket.splice(+t.dataset.i,1);renderSheet()}break;
  case 'basketdone':
    if(!sh||!sh.basket.length)break;var bt=sums(sh.basket),bsc=avgScore(sh.basket);
    sh.basket.forEach(function(x){addItem(x.meal,x.name,x.g,x.k,x.p,x.c,x.f,x.s,x.ph?{ph:x.ph}:null)});
    sh.sum={k:bt.k,p:bt.p,c:bt.c,f:bt.f,n:sh.basket.length,score:bsc};sh.basket=[];sh.view='summary';renderSheet();render();break;
  case 'theme':S.theme=(S.theme==='light')?'dark':'light';applyTheme();save();render();break;
  case 'settheme':S.theme=t.dataset.v;applyTheme();save();renderSheet();render();break;
  case 'guide':closeSheet();guideOpen();break;
  case 'arclose':if(S.arena){S.arena.last=null;save();render()}break;
  case 'pfchange':S.phChange=true;render();break;
  case 'pfdone':if(S.p.pfreq){S.phChange=false;save();render()}break;
  case 'openphoto':S.hview='photo';S.view='history';save();render();window.scrollTo(0,0);break;
  case 'phpick':var pm=t.dataset.m;if(pm==='gal'){phAsk(function(){camPick({title:'Fortschrittsfoto',onUse:phAdd})})}else{phAsk(function(){camOpen({title:'Fortschrittsfoto',facing:'user',mirror:true,hint:'Gleicher Ort, gleiches Licht, gleiche Haltung.',onUse:phAdd})})}break;
  case 'phopen':phView(t.dataset.id);break;
  case 'phplay':phPlay(false,false);break;
  case 'phsave':phPlay(false,true);break;
  case 'chatsend':var ci=document.getElementById('cin');if(ci){var tx=ci.value;ci.value='';aiSend(tx)}break;
  case 'chatchip':aiSend(t.dataset.t);break;
  }
}
function onInput(e){
  var t=e.target;
  if(xeInput(t))return;
  if(t.dataset&&t.dataset.lg){logInput(t);return}
  if(t.dataset&&t.dataset.rkf){S.rk[t.dataset.rkf]=t.value;if(S.rk.msg){S.rk.msg='';var nm=document.querySelector('.rkcard .note');if(nm)nm.remove()}return}
  if(t.dataset&&t.dataset.arf==='name'&&S.arena){S.arena.name=t.value.slice(0,16)||'Spieler';save();return}
  if(t.id==='tsearch'){S.train.q=t.value;updateAvoid();return}
  if(t.id==='egname'){S.eagle.name=t.value.slice(0,14);save();return}
  if(t.id==='pcode'&&S.sheet){S.sheet.pcode=t.value;if(S.sheet.pmsg){S.sheet.pmsg='';var nn=document.querySelector('#sheet .note');if(nn)nn.remove()}return}
  if(t.id==='ml'&&S.sheet){S.sheet.ml=t.value;updateWprev();return}
  if(t.id==='q'&&S.sheet){S.sheet.q=t.value;var r=document.getElementById('results');if(r)r.innerHTML=foodRows(t.value);return}
  if(t.id==='g'&&S.sheet){S.sheet.g=t.value;updateWprev();return}
  if(t.id==='por'&&S.sheet){S.sheet.por=t.value;updateWprev();return}
  if(t.dataset&&t.dataset.rk&&S.sheet){S.sheet.recipe[t.dataset.rk]=t.value;var b=document.querySelector('[data-act=recsave]');if(b)b.disabled=!(S.sheet.recipe.ings.length&&S.sheet.recipe.name.trim());return}
  if(t.dataset&&t.dataset.sg!==undefined&&S.sheet){var it=S.sheet.scan.items[+t.dataset.sg];it.g=t.value;var sk=document.getElementById('sk'+t.dataset.sg);if(sk)sk.textContent=fmt(it.pk*(num(t.value)||0))+' kcal';var st=document.getElementById('stot');if(st)st.innerHTML=pillsHtml(scanSum(S.sheet.scan));return}
  var k=t.dataset&&t.dataset.key;if(!k||S.view!=='wizard')return;
  if(k==='perMonth'){S.p.perMonth=+t.value;updateAmount()}else S.p[k]=t.value;
  if(k==='tw'){var tn=document.getElementById('twNote');if(tn)tn.innerHTML=twNote()}
  if(k==='age'){var an=document.getElementById('ageNote');if(an)an.innerHTML=ageNote()}
  updateNav();save();
}
app.addEventListener('click',onClick);
sheetEl.addEventListener('click',function(e){if(e.target===sheetEl){closeSheet();return}onClick(e)});
app.addEventListener('change',function(ev){var tg=ev.target;if((tg.id==='phfile'||tg.id==='phgal')&&tg.files&&tg.files[0])phAdd(tg.files[0])});
app.addEventListener('input',onInput);sheetEl.addEventListener('input',onInput);
sheetEl.addEventListener('change',function(e){
  var tg=e.target;
  if((tg.id==='bcfile'||tg.id==='bcfileg')&&tg.files&&tg.files[0]){var bf=tg.files[0],bsh=S.sheet;if(bsh){bsh.scan.status='busy';bsh.scan.msg='Ich suche den Barcode im Foto …';renderScan();bcFromFile(bf).then(function(c){if(S.sheet!==bsh)return;if(c)bcHandle(c);else{bsh.scan.status='error';bsh.scan.err='Ich konnte keinen Barcode im Foto lesen. Halte die Kamera näher und gerade und achte auf gutes Licht.';renderScan()}}).catch(function(){if(S.sheet!==bsh)return;bsh.scan.status='error';bsh.scan.err='Das Foto konnte ich nicht öffnen.';renderScan()})}return}
  if((tg.id==='phfood'||tg.id==='phfoodg')&&tg.files&&tg.files[0]){var psh=S.sheet;photoThumb(tg.files[0]).then(function(u){if(S.sheet!==psh)return;psh.photo=u;psh.q='';psh.view='search';renderSheet()}).catch(function(){toast('Das Foto konnte ich nicht öffnen.')});return}
if(e.target.id==='photo'&&e.target.files&&e.target.files[0])startScan(e.target.files[0])});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='pcode'){e.preventDefault();var b=document.querySelector('[data-act=redeem]');if(b)b.click();return}
  if(e.key==='Enter'&&e.target.id==='wkg'){e.preventDefault();saveWeight();return}
  if(e.key==='Enter'&&e.target.id==='cin'){e.preventDefault();var v=e.target.value;e.target.value='';aiSend(v);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&S.sheet)closeSheet();
});
/* Wischen auf der Startseite: Start <-> Mango */
var tx0=0,ty0=0,tOk=false;
document.addEventListener('touchstart',function(e){var t=e.touches[0];tx0=t.clientX;ty0=t.clientY;tOk=!S.sheet&&(S.view==='welcome'||S.view==='result'||S.view==='eagle'||S.view==='history'||(S.view==='train'&&(!S.premium||S.train.done)))&&!e.target.closest('.dtabs,.days,.dq,.looks,.seg,.tblwrap,#hsvg,input,.num,.text')},{passive:true});
document.addEventListener('touchend',function(e){
  if(!tOk)return;var t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){
    var ti=S.done?TABS.map(function(x){return x[0]}).indexOf(S.view):-1;
    if(ti>-1){var ni=ti+(dx<0?1:-1);if(ni<0||ni>=TABS.length)return;S.view=TABS[ni][0]}
    else if(S.view==='eagle'){S.view=S.done?'result':(S.prev==='wizard'?'wizard':'welcome')}else{S.prev=S.view;S.view='eagle'}
    render();window.scrollTo(0,0);
  }
},{passive:true});

function hov(e){if(e.target.id==='hit'){if(e.type==='pointerleave'&&e.pointerType!=='mouse')return;showTip(e.clientX)}}
app.addEventListener('pointermove',hov);app.addEventListener('pointerdown',hov);
app.addEventListener('pointerout',function(e){if(e.target.id==='hit'&&e.pointerType==='mouse')hideTip()});
/* Mango: nach 30 Sekunden Ruhe tanzt sie 30 Sekunden lang, danach sagt sie etwas Lustiges */
var egLastAct=Date.now(),egPh='idle',egT0=0,egSay='',egSayI=-1;
var EG_SAY=["Puh, ich bin ganz schön ins Schwitzen gekommen! Was machst du eigentlich gerade?","Das war mein bester Tanz seit der Mangoernte! Und was treibst du so?","Tanzen macht hungrig. Was gibt es bei dir gleich zu essen?","Ich habe 30 Sekunden getanzt und du hast nur zugeschaut. Was hast du vor?","Meine Knie sind jetzt Mus. Sag mal, was machst du gerade?","Ta-da! Falls du Applaus hast, jetzt wäre der Moment. Was machst du so?","Mango-Moves, Level 100! Hast du schon etwas gegessen oder soll ich weitertanzen?","Fertig getanzt! Jetzt bist du dran: Was steht heute noch an?","Ich bin reif für eine Pause. Und du, trägst du noch was ein oder chillst du?","Das war Kalorienverbrennung auf Mango-Art. Was hast du jetzt vor?"];
function egStopDance(){
  var d=document.querySelector('.eagle.dance');if(d)d.classList.remove('dance','v1','v2','v3','v4','bd');
  var b=document.querySelector('.mgsay');if(b)b.remove();
  egmStop(.3);egPh='idle';egSay=''}
function egSayHtml(){return egSay?'<div class="mgsay" role="status">'+esc(egSay)+'</div>':''}
function egSndHtml(){
  return '<button type="button" class="egsnd'+(S.egMute?' off':'')+'" data-act="egsnd" aria-label="'+(S.egMute?'Ton einschalten':'Ton ausschalten')+'" aria-pressed="'+(!S.egMute)+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/>'+(S.egMute?'<path d="M16 9.5l5 5M21 9.5l-5 5"/>':'<path d="M15.5 9a4.2 4.2 0 010 6M18 6.5a8 8 0 010 11"/>')+'</svg></button>'}
window.egSayHtml=function(){return egSndHtml()+egSayHtml()};
['pointerdown','keydown','touchstart','wheel','scroll'].forEach(function(ev){window.addEventListener(ev,function(e){egLastAct=Date.now();if(egPh!=='idle'&&!(e.target&&e.target.closest&&e.target.closest('.egsnd')))egStopDance()},{passive:true,capture:true})});
/* 30 s Tanz = 14 Takte bei 112 BPM: vier Tänze nacheinander, am Ende Breakdance */
var EG_BAR=60/112*4*1000,EG_SEG=[2,3,2,3],EG_BD=4,egOrder=[1,2,3,4];
function egShuffle(){var a=[1,2,3,4],i,j,t;for(i=3;i>0;i--){j=Math.floor(Math.random()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
function egCls(el,el_ms){
  var bars=el_ms/EG_BAR,acc=0,cls='bd',i;
  for(i=0;i<EG_SEG.length;i++){acc+=EG_SEG[i];if(bars<acc){cls='v'+egOrder[i];break}}
  if(!el.classList.contains('dance'))el.classList.add('dance');
  if(!el.classList.contains(cls)){el.classList.remove('v1','v2','v3','v4','bd');el.classList.add(cls)}
}
function egTick(){
  if(S.view!=='eagle'||document.hidden){if(egPh!=='idle'){egmStop(.2);egPh='idle';egSay=''}return}
  var el=document.querySelector('.wardrobe .eagle');if(!el)return;
  if(egPh==='idle'){if(Date.now()-egLastAct>=30000){egPh='dance';egT0=Date.now();egOrder=egShuffle();egCls(el,0);egmStart()}return}
  if(egPh==='dance'){
    var ms=Date.now()-egT0;
    if(ms>=30000){egStopDance();egPh='say';egSayI=(egSayI+1+Math.floor(Math.random()*3))%EG_SAY.length;egSay=EG_SAY[egSayI];var sb=document.querySelector('.wardrobe .stagebox');if(sb&&!sb.querySelector('.mgsay'))sb.insertAdjacentHTML('afterbegin',egSayHtml());egmStop(1.2);return}
    egCls(el,ms);
  }
}
window.__egTick=egTick;
setInterval(egTick,250);
load();applyTheme();render();
})();
