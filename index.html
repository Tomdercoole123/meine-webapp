<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06100B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Mahlzeit: Kalorien, Makros, Getränke und Gesundheits-Score mit Ernährungs-KI.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="config.js"></script>
<title>Mahlzeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Komplett dunkel. Aufbau: Willkommen, Fragen, Heute (Ring, Getränke, Mahlzeiten, Plan), Verlauf (90 Tage, Wochenrückblick), Essens-KI, Adler */
:root{
  color-scheme:dark;
  --bg:#06100B; --surface:#0E1813; --surface2:#15231C; --surface3:#1B2C23; --ink:#EAF3EE; --muted:#93A79C; --line:#21322A;
  --accent:#4FD1A5; --accent2:#38B6D0; --accent-ink:#03140D; --accent-soft:#12302A;
  --grad:linear-gradient(135deg,#62E8B8 0%,#37B9CF 100%);
  --protein:#8E9BFF; --carb:#F0BD4A; --fat:#FF8B73; --over:#FF8B73; --water:#5CC8FF;
  --s5:#5EE6B4; --s4:#B4DB5C; --s3:#F0BD4A; --s2:#FF9F5A; --s1:#FF7A6B;
  --body1:#8AA597; --body2:#3F5A4C;
  --glass:rgba(14,24,19,.78);
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg);background-image:radial-gradient(900px 420px at 50% -120px,rgba(79,209,165,.13),transparent 70%);background-repeat:no-repeat;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:16px 8px;min-height:100vh}
body.lock{overflow:hidden}
#app{max-width:680px;margin:0 auto}
body.hasnav #app{padding-bottom:104px}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible,[role=button]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tn{font-variant-numeric:tabular-nums}

/* Kopfleiste */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em}
.brand i{width:12px;height:12px;border-radius:4px;background:var(--grad);transform:rotate(45deg);display:block}
.brand span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.topr{display:flex;gap:8px;align-items:center}
.count{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:border-color .15s,background .15s}
.ib:hover{border-color:var(--accent);background:var(--surface2)}
.ib svg{width:20px;height:20px}
.pg-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px}
.pg-h h1{font-size:1.7rem;font-weight:800}
.pg-h small{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}

/* Segment-Leiste */
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:4px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:11px;padding:8px 14px;font-weight:600;color:var(--muted);min-height:38px;white-space:nowrap;transition:background .2s,color .2s}
.seg button.on{background:var(--grad);color:var(--accent-ink);box-shadow:0 4px 14px rgba(55,185,207,.25)}
.seg.pad{margin-bottom:14px}

/* Untere Leiste */
.tabbar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(440px,calc(100% - 28px));z-index:40;display:flex;gap:4px;padding:6px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(120,160,140,.22);border-radius:24px;box-shadow:0 14px 40px rgba(0,0,0,.55)}
.tabbar button{flex:1;display:grid;justify-items:center;gap:2px;border:0;background:transparent;border-radius:18px;padding:8px 2px 7px;color:var(--muted);font-size:.72rem;font-weight:600;min-height:54px;transition:background .2s,color .2s}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{background:var(--accent-soft);color:var(--accent)}
.tabbar button.on svg{filter:drop-shadow(0 0 8px rgba(79,209,165,.55))}

.progress{display:flex;gap:5px;margin-bottom:16px}
.progress i{flex:1;height:6px;border-radius:99px;background:var(--surface3);transition:background .3s}
.progress i.on{background:var(--grad)}

/* Adler und Sprechblase (stumm) */
.coach{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.coach .eg{flex:0 0 112px;width:112px}
.eagle{display:block;width:100%;height:auto;overflow:visible}
.eagle .head{animation:bob 5s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.eagle .lid{transform-box:fill-box;transform-origin:50% 0;animation:blink 5.5s infinite;transform:scaleY(0)}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
@keyframes bob{0%,100%{transform:rotate(0)}50%{transform:rotate(-1.2deg)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.bubble::after{content:"";position:absolute;left:-9px;bottom:22px;width:16px;height:16px;background:var(--surface2);border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}
.bubble h1{font-size:1.28rem;font-weight:800}
.stage{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:6px}
.stage{overflow-x:clip;grid-template-columns:minmax(0,1fr)}.stage .eg{width:410px;max-width:none;justify-self:start;margin-inline:calc(50% - 205px)}
.stage .bubble{max-width:420px;width:100%;margin:0}
.stage .bubble::after{left:50%;bottom:auto;top:-9px;margin-left:-8px;transform:rotate(135deg)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 16px}
.sub{color:var(--muted);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stack{display:grid;gap:10px}
.opt{background:var(--surface2);border:2px solid transparent;border-radius:16px;padding:14px;text-align:left;min-height:56px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt b{font-family:var(--font-display);font-size:1.1rem}
.opt small{color:var(--muted);font-size:.9rem;line-height:1.35;display:block}
.opt .tag{align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 9px;font-variant-numeric:tabular-nums}
.opt.sel .tag{background:var(--bg)}
.opt .ico{width:34px;height:34px;color:var(--accent)}
.opt.act .ah{display:flex;flex-direction:column;gap:2px}
.opt.act .st2{font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;font-size:.92rem}
.bf{padding:8px 6px 10px;align-items:center;text-align:center;gap:4px}
.bf svg{width:100%;max-width:96px;height:auto;margin-bottom:4px}
.bf small{font-size:.78rem}

.field{margin-top:14px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.num{display:flex;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:4px 16px}
.num:focus-within{border-color:var(--accent)}
.num input{flex:1;min-width:0;width:100%;border:0;background:transparent;color:var(--ink);font:700 1.7rem var(--font-display);font-variant-numeric:tabular-nums;padding:8px 0;outline:0}
.num .unit{color:var(--muted);font-weight:600}
.text{width:100%;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);font:inherit}
.text:focus{border-color:var(--accent);outline:0}
.hint{font-size:.9rem;color:var(--muted);margin-top:10px}
.note{background:var(--accent-soft);border-radius:14px;padding:10px 14px;font-size:.92rem;margin-top:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:42px;font-weight:500;transition:border-color .15s,background .15s}
.chip[aria-pressed="true"],.chip.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.chip:hover{border-color:var(--accent)}
.group{margin-top:20px}
.group h2{font-size:1.02rem;margin-bottom:4px}
.group .hint{margin:0 0 10px}

.big{font-family:var(--font-display);font-weight:800;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.big span.u{font-size:1.05rem;font-weight:600;color:var(--muted);margin-left:6px}
/* Regler */
.rng{-webkit-appearance:none;appearance:none;width:100%;margin:22px 0 6px;height:34px;background:transparent;--pct:20%}
.rng::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:linear-gradient(to right,var(--accent) var(--pct),var(--surface3) var(--pct))}
.rng::-moz-range-track{height:10px;border-radius:99px;background:var(--surface3)}
.rng::-moz-range-progress{height:10px;border-radius:99px;background:var(--accent)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-10px;border-radius:50%;background:var(--ink);border:6px solid var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.5)}
.rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--ink);border:6px solid var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.info{margin-top:16px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}

.nav{position:sticky;bottom:0;display:flex;gap:10px;padding-block:14px 10px;margin-top:16px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{border-radius:16px;border:1.5px solid var(--line);background:var(--surface2);padding:0 20px;min-height:52px;font-weight:700;transition:border-color .15s,transform .1s}
.btn.pri{flex:1;background:var(--grad);border-color:transparent;color:var(--accent-ink);font-size:1.05rem;box-shadow:0 8px 24px rgba(55,185,207,.2)}
.btn.pri:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem;border-radius:12px}
.btn.full{width:100%}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.danger{color:var(--over);border-color:#4A2A24}

.load{width:min(320px,80%);height:10px;border-radius:99px;background:var(--surface3);overflow:hidden}
.load i{display:block;height:100%;background:var(--grad);width:0;animation:ld 3.4s ease-in-out forwards;border-radius:99px}
@keyframes ld{to{width:100%}}

/* Heute */
.ringcard{display:grid;justify-items:center;gap:18px;padding:22px 16px;background:linear-gradient(180deg,var(--surface2),var(--surface))}
.ringbox{position:relative;display:grid;place-items:center}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rc{position:relative;text-align:center;line-height:1.15}
.rc small{display:block;color:var(--muted);font-size:.85rem}
.rc b{display:block;font-family:var(--font-display);font-weight:800;font-size:3.1rem;font-variant-numeric:tabular-nums;line-height:1}
.rc.over b{color:var(--over)}
.rc span{display:block;margin-top:6px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.mini{display:grid;justify-items:center;gap:6px;text-align:center}
.mini .rc b{font-size:1.15rem}
.mini .rc small{font-size:.7rem}
.mini .nm{font-weight:700;font-size:.9rem}
.mini .of{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sec{margin-top:26px}
.sec>h2{font-size:1.35rem;font-weight:800}
.sec>.sub{margin:4px 0 12px}
.meals{display:grid;gap:10px}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:10px;cursor:pointer;transition:border-color .15s}
.meal:hover{border-color:var(--accent)}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mh b{font-family:var(--font-display);font-size:1.2rem}
.mh small{display:block;color:var(--muted);font-size:.85rem}
.mk{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;white-space:nowrap}
.mk b{font-size:1.15rem;color:var(--ink);font-family:var(--font-body)}
.plus{width:36px;height:36px;border-radius:12px;background:var(--grad);color:var(--accent-ink);display:grid;place-items:center;font-size:1.4rem;font-weight:700;line-height:1}
.mbar,.pbar{height:8px;border-radius:99px;background:var(--surface3);overflow:hidden}
.mbar i,.pbar i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s ease;min-width:0}
.pbar.water i{background:linear-gradient(90deg,#5CC8FF,#7C9CFF)}
.mi{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.mi li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.93rem}
.mi li>span:first-child{min-width:0;overflow-wrap:anywhere}
.mi li em{font-style:normal;color:var(--muted);font-size:.84rem;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:10px;font-size:1.2rem;line-height:1;flex:0 0 auto}
.x:hover{color:var(--over)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.fact{font-size:.82rem;color:var(--muted)}
.fact b{display:block;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
details.how{margin-top:26px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px}
details.how summary{cursor:pointer;font-weight:600}

/* Gesundheits-Score */
.sc{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:22px;padding:0 7px;border-radius:8px;font-weight:800;font-size:.78rem;font-variant-numeric:tabular-nums;background:var(--surface3);color:var(--ink);vertical-align:middle}
.sc.b5{color:var(--s5);background:rgba(94,230,180,.13)}.sc.b4{color:var(--s4);background:rgba(180,219,92,.13)}.sc.b3{color:var(--s3);background:rgba(240,189,74,.13)}.sc.b2{color:var(--s2);background:rgba(255,159,90,.13)}.sc.b1{color:var(--s1);background:rgba(255,122,107,.14)}
.scorecard{display:flex;align-items:center;gap:14px;margin-top:12px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:20px}
.gauge{position:relative;width:64px;height:64px;flex:0 0 auto;display:grid;place-items:center}
.gauge svg{position:absolute;inset:0;transform:rotate(-90deg)}
.gauge b{font-family:var(--font-display);font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
.scorecard h3{font-size:1.05rem}
.scorecard p{color:var(--muted);font-size:.88rem;line-height:1.35}

/* Getränke */
.drinks{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px}
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.dh b{font-family:var(--font-display);font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums}
.dh small{color:var(--muted);font-size:.85rem;display:block}
.dh .drop{width:34px;height:34px;color:var(--water);flex:0 0 auto}
.dq{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.dq::-webkit-scrollbar{display:none}
.dq button{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface2);border-radius:14px;padding:8px 13px;min-height:46px;font-weight:600;font-size:.9rem;display:grid;text-align:left;line-height:1.2}
.dq button small{color:var(--muted);font-size:.74rem;font-weight:500}
.dq button:hover{border-color:var(--water)}
.dl{display:grid;gap:6px;font-size:.9rem}
.dl div{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dl em{font-style:normal;color:var(--muted);font-size:.84rem;white-space:nowrap}

/* Verlauf */
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{display:block;font-family:var(--font-display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:.8rem;color:var(--muted)}
.chartbox{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px 10px 10px}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.chartbox .ax{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
.chartbox .gl{stroke:var(--line);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--surface3);border:1px solid var(--line);border-radius:12px;padding:8px 11px;font-size:.84rem;line-height:1.35;z-index:5;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5);transform:translate(-50%,-100%)}
.tip b{display:block;font-size:.95rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:10px 4px 0;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:0;border-top:2px dashed var(--muted);border-radius:0;width:14px;vertical-align:3px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--line)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--surface)}
.tblwrap{max-height:340px;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 8px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-top:12px}
.week.new{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,209,165,.1)}
.wh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wh h3{font-size:1.15rem}
.wh small{color:var(--muted);font-size:.84rem}
.badge{font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--grad);color:var(--accent-ink);border-radius:99px;padding:3px 10px}
.wst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:12px 0}
.wst div{font-size:.74rem;color:var(--muted);line-height:1.25}
.wst b{display:block;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.wd{border-top:1px solid var(--line);padding:8px 0}
.wd summary{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;font-weight:600;list-style:none;min-height:36px}
.wd summary::-webkit-details-marker{display:none}
.wd summary span:last-child{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:500;font-size:.88rem;font-variant-numeric:tabular-nums}
.wd .wm{margin:8px 0 4px;padding-left:2px}
.wd .wm h4{margin:10px 0 4px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.wd .wm ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.9rem}
.wd .wm li{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wd .wm li span:first-child{min-width:0;overflow-wrap:anywhere}
.wd .wm li em{font-style:normal;color:var(--muted);font-size:.82rem;white-space:nowrap}
.aisum{margin-top:12px;background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:.93rem;white-space:pre-wrap}

.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:68px;border:1.5px solid var(--line);background:var(--surface);border-radius:15px;padding:6px 10px;text-align:center;line-height:1.2;position:relative}
.day b{display:block;font-size:.92rem}
.day small{font-size:.76rem;color:var(--muted)}
.day.sel{border-color:var(--accent);background:var(--accent-soft)}
.day.has::after{content:"";position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .grow{flex:1;margin:0}
.dishes{display:grid;gap:12px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:8px}
.dish .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.8rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.dish .meta span:last-child{color:var(--muted);text-transform:none;letter-spacing:0;font-weight:600;display:flex;gap:8px;align-items:center}
.dish h3{font-size:1.2rem}
.dish p{color:var(--muted);font-size:.95rem}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.82rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--bg);font-variant-numeric:tabular-nums}
.pill.k{background:var(--grad);color:var(--accent-ink)}
.pill.p{color:var(--protein)}.pill.c{color:var(--carb)}.pill.f{color:var(--fat)}
.dish details summary{cursor:pointer;font-weight:600;font-size:.92rem;padding:6px 0}
.dish ul,.dish ol{margin:4px 0 8px;padding-left:20px;font-size:.93rem}
.dish li{margin-bottom:3px}
.dish h4{margin:8px 0 2px;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dish .acts{display:flex;gap:8px;flex-wrap:wrap}
.skel{height:132px;border-radius:20px;background:linear-gradient(90deg,var(--line),var(--surface),var(--line));background-size:200% 100%;animation:sh 1.4s linear infinite;opacity:.7}
@keyframes sh{to{background-position:-200% 0}}
.sum{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:14px;font-size:.9rem;color:var(--muted)}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.empty{border:2px dashed var(--line);border-radius:20px;padding:26px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:1.15rem;margin-bottom:6px}
.err{background:#3A1F18;color:var(--over);border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:500;font-size:.93rem}
.foot{margin-top:28px;font-size:.82rem;color:var(--muted);padding-bottom:20px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:14px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,rgba(98,232,184,.16),rgba(55,185,207,.12));border:1px solid rgba(79,209,165,.35)}
.banner b{display:block;font-family:var(--font-display);font-size:1.05rem}
.banner small{color:var(--muted)}

/* Essens-KI */
.aihead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.aihead .av{width:56px;height:56px;border-radius:18px;background:var(--grad);display:grid;place-items:center;color:var(--accent-ink);flex:0 0 auto}
.aihead .av svg{width:30px;height:30px}
.aihead h1{font-size:1.5rem;font-weight:800}
.aihead small{color:var(--muted);display:block;font-size:.88rem;line-height:1.3}
.log{display:grid;gap:10px;margin:8px 0 12px}
.log.page{min-height:36vh}
.msg{max-width:90%;padding:10px 14px;border-radius:18px;font-size:.96rem;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.u{justify-self:end;background:var(--accent-soft);border-bottom-right-radius:5px}
.msg.a{justify-self:start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg small{display:block;margin-top:6px;color:var(--accent);font-weight:600}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.chat-in{display:flex;gap:8px}
.chat-in .text{flex:1;border-radius:16px}
.chat-in.dock{position:sticky;bottom:88px;padding:8px;margin-top:10px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px}
.ai-tools{display:flex;gap:8px;margin-top:10px}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(0,0,0,.66);align-items:flex-end;justify-content:center}
#sheet.open{display:flex}
.panel{width:100%;max-width:680px;max-height:90vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media (prefers-reduced-motion:reduce){.panel,.skel,.eagle .head,.eagle .lid,.load i{animation:none}.load i{width:100%}}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.ph h2{font-size:1.3rem}
.ph .bk{border:0;background:transparent;color:var(--accent);font-weight:700;min-height:40px;padding:0 6px}
.menu{display:grid;gap:10px}
.mopt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--surface2);border:1.5px solid transparent;border-radius:18px;padding:14px;min-height:64px;width:100%;transition:border-color .15s}
.mopt:hover{border-color:var(--accent)}
.mopt svg{width:30px;height:30px;color:var(--accent);flex:0 0 auto}
.mopt b{display:block;font-family:var(--font-display);font-size:1.08rem}
.mopt small{color:var(--muted);font-size:.88rem}
.list{display:grid;gap:8px;margin-top:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;width:100%}
button.row:hover{border-color:var(--accent)}
.row b{font-weight:600}
.row small{color:var(--muted);display:block;font-size:.82rem}
.row em{font-style:normal;color:var(--muted);font-size:.85rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.photo{width:100%;max-height:220px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--grad);color:var(--accent-ink);font-weight:700;border-radius:999px;padding:10px 18px;z-index:80;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.45)}
.legal{font-size:.9rem;color:var(--muted);display:grid;gap:10px}
.legal b{color:var(--ink)}

/* Adler-Kleiderschrank */
.wardrobe .stagebox{position:relative;border-radius:28px;background:radial-gradient(circle at 50% 38%,rgba(79,209,165,.2),rgba(55,185,207,.05) 55%,transparent 72%),var(--surface);border:1px solid var(--line);padding:18px 10px 10px;display:grid;justify-items:center;gap:6px}
.wardrobe .stagebox{overflow-x:clip;grid-template-columns:minmax(0,1fr)}.wardrobe .eg{width:410px;max-width:none;margin:0 calc(50% - 205px);justify-self:start}
.wardrobe .nm{display:flex;gap:8px;align-items:center;width:min(300px,100%)}
.wardrobe .nm .text{text-align:center;font-weight:700;font-family:var(--font-display);font-size:1.1rem;padding:8px 12px}
.slots{margin:16px 0 12px}
.looks{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.looks::-webkit-scrollbar{display:none}
.looks .chip{flex:0 0 auto}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.sw button.on{border-color:var(--ink)}
.wlabel{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}

@media (max-width:520px){
  .coach .eg{flex-basis:92px;width:92px}
  .bubble h1{font-size:1.15rem}
  .wst{grid-template-columns:repeat(2,minmax(0,1fr))}
}
.chat-in .btn svg{width:22px;height:22px;display:block;margin:auto}
.tbl td,.tbl th{white-space:nowrap}

/* Premium */
.tabbar button .lk{display:inline-block;margin-left:3px;vertical-align:-1px}
.tabbar button .lk svg{width:10px;height:10px}
.lockcard{text-align:left;background:linear-gradient(180deg,var(--surface2),var(--surface))}
.lockbadge{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);background:var(--grad);border-radius:99px;padding:4px 11px 4px 9px;margin-bottom:10px}
.lockbadge svg{width:14px;height:14px}
.premcard{border-radius:20px;padding:18px;background:linear-gradient(135deg,rgba(98,232,184,.18),rgba(55,185,207,.12));border:1px solid rgba(79,209,165,.4);margin-bottom:12px}
.premcard.on{background:var(--accent-soft)}
.premcard h3{font-size:1.2rem}
.price{display:flex;align-items:baseline;gap:8px}
.price b{font-family:var(--font-display);font-size:2.6rem;font-weight:800;line-height:1;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.price span{color:var(--muted);font-weight:600}
.benefits{list-style:none;margin:0 0 16px;padding:0;display:grid;gap:10px}
.benefits li{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.benefits li>svg{width:22px;height:22px;color:var(--accent);flex:0 0 auto;margin-top:1px}
.benefits b{display:block;font-family:var(--font-display)}
.benefits small{color:var(--muted);font-size:.88rem;line-height:1.35;display:block}

.trcard{display:flex;align-items:center;gap:14px;width:100%;margin-top:12px;padding:14px 16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;transition:border-color .15s}
.trcard:hover{border-color:var(--accent)}
.trcard .ic{width:46px;height:46px;border-radius:15px;background:var(--grad);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 auto}
.trcard .ic svg{width:26px;height:26px}
.trcard div{flex:1;min-width:0}
.trcard b{display:block;font-family:var(--font-display);font-size:1.1rem}
.trcard small{color:var(--muted);font-size:.88rem}
.trcard .ch{color:var(--muted);flex:0 0 auto}
.trcard .ch svg{width:20px;height:20px;display:block}

/* Adler springt von Frage zu Frage */
.etrack{position:relative;height:58px;margin:0 24px 12px}
.et-line{position:absolute;left:0;right:0;bottom:7px;height:6px;border-radius:99px;background:var(--surface3);overflow:hidden}
.et-line i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .55s cubic-bezier(.4,.1,.2,1)}
.et-dot{position:absolute;bottom:6px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg);border:2px solid var(--surface3)}
.et-dot.on{border-color:var(--accent);background:var(--accent)}
.et-bird{position:absolute;bottom:9px;width:42px;height:50px;margin-left:-21px;transition:left .55s cubic-bezier(.4,.1,.2,1);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
.et-in{width:100%;height:100%}
.et-in svg{display:block;width:100%;height:100%}
.et-in svg .head{animation:none}
.et-bird.hop .et-in{animation:hop .55s ease}
@keyframes hop{0%{transform:translateY(0)}45%{transform:translateY(-16px) rotate(-7deg)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.et-bird,.et-line i{transition:none}.et-bird.hop .et-in{animation:none}}

/* Wochenplan Muskeln */
.splitlist{display:flex;flex-direction:column;gap:8px}
.sday{background:var(--surface2);border:1px solid var(--line,rgba(255,255,255,.08));border-radius:16px;overflow:hidden}
.sday.done{border-color:rgba(110,231,183,.35)}
.sday.open{border-color:var(--accent,#6EE7B7)}
.shead{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;background:none;border:0;color:var(--ink);font:inherit;text-align:left;cursor:pointer;min-height:52px}
.shead b{flex:0 0 92px;font-weight:700}
.mchips{display:flex;flex-wrap:wrap;gap:5px;flex:1}
.mchip{padding:3px 9px;border-radius:99px;background:rgba(110,231,183,.16);color:var(--ink);font-size:12.5px;font-weight:600}
.mchip.rest{background:rgba(255,255,255,.1)}
.mnone{font-size:12.5px;opacity:.5}
.mpanel{padding:0 12px 14px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mu-o{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:var(--surface3,#1B2C23);color:var(--ink);font:inherit;font-size:14px;font-weight:600;text-align:left;cursor:pointer;min-height:44px}
.mu-o i{font-style:normal;flex:0 0 22px;height:22px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:11.5px}
.mu-o.sel{border-color:var(--accent,#6EE7B7);background:rgba(110,231,183,.18)}
.mu-o.wide{grid-column:1/-1}
.mu-o:disabled{opacity:.35;cursor:not-allowed}
/* Training-Seite */
.tabbar button{font-size:.68rem}
.gencard h3{margin:0 0 6px}
.pbar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#38BDF8);border-radius:99px;transition:width .5s}
.pbar.big{height:6px;margin:12px 0 16px}
.note.warn{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.08)}
.lnk{background:none;border:0;color:var(--accent);font:inherit;font-weight:700;text-decoration:underline;padding:0;cursor:pointer}
.wk{padding:6px 14px}
.wkr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.wkr:last-child{border:0}
.wkr b{flex:0 0 28px;font-weight:700}
.wkr span{flex:1;font-weight:600}
.wkr em{font-style:normal;color:var(--muted);font-size:.85rem}
.wkr.rest span{color:var(--muted);font-weight:500}
.tses{background:var(--surface2);border:1px solid rgba(255,255,255,.08);border-radius:16px;margin-bottom:8px;overflow:hidden}
.tses summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none;min-height:56px}
.tses summary::-webkit-details-marker{display:none}
.tses .dn{flex:0 0 40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800}
.tses .tt{display:grid;gap:2px}
.tses .tt small{color:var(--muted)}
.tses[open]{border-color:rgba(79,209,165,.45)}
.tbody{padding:2px 14px 16px}
.sh{margin:14px 0 6px;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.plain{margin:0;padding-left:18px;display:grid;gap:6px}
.exl{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.exl li{background:var(--surface3,#1B2C23);border-radius:12px;padding:10px 12px}
.ex-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-sets{color:var(--accent);font-weight:800;white-space:nowrap}
.ex-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ex-m span{font-size:.75rem;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08)}
.ex-t,.ex-w{margin:6px 0 0;font-size:.85rem;color:var(--muted)}
.cardio{background:var(--surface3,#1B2C23);border-radius:12px;padding:10px 12px}
.cardio p{margin:6px 0 0;font-size:.88rem;color:var(--muted)}
.vol{padding:8px 14px}
.vrow{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;align-items:center;padding:8px 0}
.vn{font-weight:600}
.vb{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.vb i{display:block;height:100%;border-radius:99px}
.vb i.ok{background:var(--accent)}.vb i.mid{background:#38BDF8}.vb i.low{background:#FBBF24}.vb i.hi{background:#A78BFA}
.vv{grid-column:2;font-size:.78rem;color:var(--muted)}
.phs{padding:6px 14px}
.ph{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.ph:last-child{border:0}
.ph-h{display:flex;justify-content:space-between;gap:8px}
.ph-h span{color:var(--muted);font-size:.85rem}
.ph p{margin:4px 0 0;font-size:.9rem;color:var(--muted)}
.ph.cur .ph-h b{color:var(--accent)}
.ph.cur{border-left:3px solid var(--accent);padding-left:10px}
/* 90-Tage-Kalender */
.cal{background:var(--surface2);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:10px 8px;margin-bottom:10px}
.cal-h,.cal-r{display:grid;grid-template-columns:26px repeat(7,1fr) 30px;gap:4px;align-items:center}
.cal-h{margin-bottom:4px}
.cal-h b{text-align:center;font-size:.7rem;color:var(--muted);font-weight:600}
.cal-r{margin-bottom:4px}
.wl,.wc{font-size:.66rem;color:var(--muted);text-align:center}
.cc{position:relative;aspect-ratio:1;min-height:36px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);font:inherit;font-size:.78rem;display:grid;place-items:center;padding:0;cursor:pointer}
.cc.x{pointer-events:none}
.cc.pl{background:rgba(79,209,165,.14);border-color:rgba(79,209,165,.4);color:var(--ink);font-weight:700}
.cc.rs{background:rgba(255,255,255,.04);color:var(--muted)}
.cc.dn{background:var(--accent);color:#04130C;border-color:var(--accent)}
.cc.ms{background:transparent;border:1px dashed rgba(251,191,36,.6);color:var(--muted)}
.cc.td{box-shadow:0 0 0 2px var(--ink)}
.cc.sl:not(.td){box-shadow:0 0 0 2px #38BDF8}
.cc em{position:absolute;right:3px;bottom:0;font-style:normal;font-size:.62rem;font-weight:800}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px;border:1px solid transparent}
.lg.pl{background:rgba(79,209,165,.14);border-color:rgba(79,209,165,.4)}.lg.dn{background:var(--accent)}.lg.rs{background:rgba(255,255,255,.1)}.lg.ms{border:1px dashed rgba(251,191,36,.7)}
.caldet{margin-top:12px}
.cd-h small{display:block;color:var(--muted);margin-top:2px}
/* Verlauf verständlicher */
.hsum{background:var(--surface2);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:14px 16px;margin:0 0 14px}
.hsum p{margin:0 0 10px;line-height:1.5}
.hchip{display:inline-block;padding:5px 12px;border-radius:99px;font-size:.82rem;font-weight:700}
.hchip.ok{background:rgba(79,209,165,.18);color:var(--accent)}
.hchip.lo{background:rgba(251,191,36,.16);color:#FBBF24}
.hchip.hi{background:rgba(167,139,250,.18);color:#C4B5FD}
.ch-t{font-size:1.02rem;margin:4px 0 2px}
.ch-h{margin:0 0 8px}
.lt{display:inline-block;width:16px;height:3px;border-radius:2px;background:#38BDF8;vertical-align:3px;margin-right:6px}
.gshare{margin:12px 0}
.gs-h{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.gs-h b{color:var(--accent)}
.expl{background:var(--surface2);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;margin:0 0 14px}
.expl summary{cursor:pointer;font-weight:600}
.expl ul{margin:10px 0 2px;padding-left:18px;display:grid;gap:6px;color:var(--muted);font-size:.9rem}
/* Tagesansicht Training */
.wknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px;font-size:.88rem;color:var(--muted)}
.wknav b{color:var(--ink)}
.wknav button{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:var(--surface2);color:var(--ink);font-size:1.3rem;cursor:pointer}
.wknav button:disabled{opacity:.3}

.rk-hd{display:flex;gap:12px;align-items:center}
.rk-mini{flex:none;width:44px;height:52px;display:grid;place-items:center;filter:drop-shadow(0 0 8px var(--rc,transparent))}
.rk-mini svg{width:100%;height:100%}
.rk-mini.rk-none{filter:none;width:44px;height:44px;border-radius:14px;background:var(--surface2);color:var(--accent)}
.rk-mini.rk-none svg{width:24px;height:24px}

.rk-list{display:grid;gap:6px}
.rk-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer}
.rk-row .t,.rk-row .v{display:grid;gap:1px;min-width:0}
.rk-row .t{flex:1}.rk-row .v{text-align:right}
.rk-row b{font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk-row small{color:var(--muted);font-size:.76rem}
body.rk-lock{overflow:hidden}
.rk-ov{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:18px;overflow:auto;background:radial-gradient(circle at 50% 35%,rgba(6,16,11,.82),rgba(2,6,4,.97) 70%);animation:rkin .35s ease both;--rc:#6fe3ee;--rc2:#1b8aa0}
.rk-rays{position:absolute;left:50%;top:34%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;pointer-events:none;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 22%,transparent) 0 5deg,transparent 5deg 15deg);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 42%);mask-image:radial-gradient(circle,#000 0,transparent 42%);opacity:0;animation:rkfade 1.4s .45s ease forwards,rkspin 40s linear infinite}
.rk-glow{position:absolute;left:50%;top:34%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;pointer-events:none;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 45%,transparent),transparent 66%);opacity:0;animation:rkfade 1.2s .5s ease forwards,rkpulse 3.4s 1.8s ease-in-out infinite}
.rk-sp{position:absolute;left:50%;top:34%;width:0;height:0;pointer-events:none}
.rk-sp i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:var(--rc);box-shadow:0 0 12px var(--rc),0 0 3px #fff;opacity:0;animation:rkspark 1.7s ease-out var(--d) both}
.rk-box{position:relative;width:100%;max-width:340px;text-align:center;padding:6px 0 4px}
.rk-top{font:700 .78rem var(--font-body);letter-spacing:.28em;text-transform:uppercase;color:var(--muted);opacity:0;animation:rkrise .6s .1s ease forwards}
.rk-em{position:relative;width:168px;height:200px;margin:14px auto 6px;perspective:700px}
.rk-em>svg{width:100%;height:100%;filter:drop-shadow(0 0 22px var(--rc)) drop-shadow(0 6px 10px rgba(0,0,0,.5));animation:rkpop 1.35s cubic-bezier(.22,1.2,.3,1) .35s both,rkfloat 3.4s ease-in-out 1.9s infinite}
.rk-shine{position:absolute;inset:0;overflow:hidden;clip-path:polygon(50% 3%,92% 15%,92% 48%,82% 78%,50% 97%,18% 78%,8% 48%,8% 15%);pointer-events:none}
.rk-shine::after{content:"";position:absolute;top:-10%;bottom:-10%;width:34%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-14deg);animation:rkshine 1.1s 1.55s ease-out both,rkshine 1.1s 4.6s ease-out infinite}
.rk-name{font:800 2.3rem/1.1 var(--font-display);letter-spacing:.02em;margin-top:6px;min-height:2.6rem;color:var(--rc)}
.rk-name span{display:inline-block;opacity:0;background:linear-gradient(180deg,#fff,var(--rc) 55%,var(--rc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rkletter .6s ease both}
.rk-pct{font:800 2.6rem/1 var(--font-display);margin-top:8px;font-variant-numeric:tabular-nums;opacity:0;animation:rkrise .5s .7s ease forwards}
.rk-pct b{font-weight:800}
.rk-sub{margin:4px 0 0;color:var(--ink);opacity:0;animation:rkrise .5s .9s ease forwards}
.rk-info{margin:10px 0 0;font-size:.85rem;color:var(--muted);opacity:0;animation:rkrise .5s 1.3s ease forwards}
.rk-lad{display:flex;gap:4px;justify-content:center;margin:16px 0 6px;opacity:0;animation:rkrise .5s 1.4s ease forwards}
.rk-lad span{width:26px;height:31px;flex:none;opacity:.22;filter:grayscale(1);transition:opacity .3s,filter .3s,transform .35s cubic-bezier(.3,1.6,.5,1)}
.rk-lad span svg{width:100%;height:100%;display:block}
.rk-lad span.on{opacity:1;filter:none}
.rk-lad span.cur{transform:scale(1.4) translateY(-2px);filter:drop-shadow(0 0 7px var(--rc))}
.rk-src{margin:8px 0 0;font-size:.74rem;color:var(--muted);opacity:0;animation:rkrise .5s 1.6s ease forwards}
.rk-box .btn{opacity:0;animation:rkrise .5s 1.7s ease forwards}
.rk-o .rk-em>svg,.rk-o .rk-mini svg,.rk-o .rk-lad span.cur{animation-name:rkpop,rkfloat,rkhue}
.rk-o .rk-em>svg{animation:rkpop 1.35s cubic-bezier(.22,1.2,.3,1) .35s both,rkfloat 3.4s ease-in-out 1.9s infinite,rkhue 5s linear 1.9s infinite}
.rk-o .rk-mini svg,.rk-o .rk-lad span.cur{animation:rkhue 5s linear infinite}
@keyframes rkin{from{opacity:0}to{opacity:1}}
@keyframes rkfade{to{opacity:1}}
@keyframes rkspin{to{transform:rotate(360deg)}}
@keyframes rkpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes rkrise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rkpop{0%{transform:scale(.05) rotateY(-540deg);opacity:0}55%{transform:scale(1.2) rotateY(0);opacity:1}78%{transform:scale(.94)}100%{transform:scale(1);opacity:1}}
@keyframes rkfloat{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.02)}}
@keyframes rkshine{0%{left:-50%}100%{left:130%}}
@keyframes rkletter{from{opacity:0;transform:translateY(16px) scale(.6);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes rkspark{0%{transform:translate(0,0) scale(.3);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) scale(1.2);opacity:0}}
@keyframes rkhue{to{filter:hue-rotate(360deg) drop-shadow(0 0 14px #ffd76a)}}
@media (prefers-reduced-motion:reduce){.rk-ov *,.rk-ov{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}

function twNote(){
  var w=num(S.p.weight),t=num(S.p.tw);if(S.p.tw===''||!isFinite(t)||!isFinite(w))return '';
  var d=t-w;
  if(Math.abs(d)<.5)return '<div class="note">Du bist schon sehr nah an deinem Zielgewicht.</div>';
  if(S.p.goal==='lose'&&d>0)return '<div class="note">Dein Zielgewicht liegt über deinem Gewicht, du hast aber Abnehmen gewählt. Du kannst zurückgehen und dein Ziel ändern.</div>';
  if(S.p.goal==='gain'&&d<0)return '<div class="note">Dein Zielgewicht liegt unter deinem Gewicht, du hast aber Zunehmen gewählt. Du kannst zurückgehen und dein Ziel ändern.</div>';
  return '<div class="note">Das sind '+fmt1(Math.abs(d))+' kg '+(d<0?'abnehmen':'zunehmen')+'.</div>';
}
function goalInfo(c){
  var w=num(S.p.weight),t=num(S.p.tw);if(!isFinite(t)||!isFinite(w)||S.p.tw==='')return '';
  var d=Math.abs(t-w);if(d<.5)return 'Dein Zielgewicht ist erreicht.';
  if((S.p.goal==='lose')!==(t<w))return '';
  var mo=d/Math.max(c.actual,.1);
  return 'Bis zu deinem Zielgewicht ('+fmt1(t)+' kg) sind es '+fmt1(d)+' kg, bei diesem Tempo etwa '+(mo<1.5?'1 Monat':fmt1(mo)+' Monate')+'.';
}

function ring(size,stroke,frac,color){
  var r=(size-stroke)/2,C=2*Math.PI*r,f=Math.max(0,Math.min(1,frac)),g='',col=color;
  if(color==='grad'){var id='rg'+(++egN);g='<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#62E8B8"/><stop offset="1" stop-color="#37B9CF"/></linearGradient></defs>';col='url(#'+id+')'}
  return '<svg viewBox="0 0 '+size+' '+size+'" aria-hidden="true">'+g+'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface3)" stroke-width="'+stroke+'"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+stroke+'" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-f))+'" style="transition:stroke-dashoffset .6s ease"/></svg>';
}
function gaugeHtml(sc,size){
  var b=band(sc==null?0:sc),col=sc==null?'var(--line)':'var(--s'+b[0].slice(1)+')',r=(size-8)/2,C=2*Math.PI*r;
  return '<div class="gauge" style="width:'+size+'px;height:'+size+'px"><svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface3)" stroke-width="7"/><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-(sc==null?0:sc/100)))+'"/></svg><b>'+(sc==null?'–':sc)+'</b></div>';
}

  var meals=sl.map(function(s){

function chartHtml(){
  var m=S.hist.metric,N=S.hist.range,keys=histKeys(N),vals=keys.map(function(k){return dayVal(m,k)}),goal=dayGoal(m,keys[N-1]);

  s+='<rect id="hl" x="0" y="'+T+'" width="'+slot+'" height="'+ph+'" fill="var(--ink)" opacity=".09" rx="3" display="none"/>';
  vals.forEach(function(v,i){

  });

  var step=N===7?1:N===30?5:15;
  keys.forEach(function(k,i){

  });
  s+='<rect id="hit" x="'+L+'" y="0" width="'+pw+'" height="'+H+'" fill="transparent" style="cursor:crosshair"/></svg><div class="tip" id="htip" style="display:none"></div>';
  var lg='<div class="legend"><span><i style="background:'+HM[m].col+'"></i>'+HM[m].n+(HM[m].u?' pro Tag':' pro Tag (1 bis 100)')+'</span>'+(m==='k'?'<span><i style="background:var(--over)"></i>Über dem Ziel (mehr als +10 %)</span>':'')+(goal?'<span><i class="ln"></i>Ziel</span>':'')+(N>7?'<span><i class="lt"></i>7-Tage-Schnitt</span>':'')+'</div>';

function histStats(){

function weekData(startKey){
  var st=parseKey(startKey),days=[];
  for(var i=0;i<7;i++){var d=new Date(st);d.setDate(d.getDate()+i);var k=keyOf(d);if(k>keyOf(today(0)))break;days.push({k:k,d:d,items:S.log[k]||[]})}
  var logged=days.filter(function(x){return x.items.length});
  days.forEach(function(x){x.st=dayStats(x.items)});
  return {start:st,days:days,logged:logged,end:new Date(st.getTime()+6*864e5)};
}
function weekKeys(){
  var a=[],cur=weekStart(today(0));
  for(var i=0;i<14;i++){var d=new Date(cur);d.setDate(d.getDate()-7*i);if(d<weekStart(today(-89)))break;a.push(keyOf(d))}
  return a;
}
function newWeek(){
  var k=keyOf(weekStart(today(-7)));
  if(S.seenWeek===k)return null;
  var w=weekData(k);return w.logged.length?k:null;
}
function mealGroups(items){
  var order=(SLOTS[S.p.meals]||SLOTS[3]).concat(['Getränke']),g={};
  items.forEach(function(i){(g[i.meal]=g[i.meal]||[]).push(i)});
  var names=order.filter(function(n){return g[n]}).concat(Object.keys(g).filter(function(n){return order.indexOf(n)<0}));
  return names.map(function(n){return {n:n,items:g[n]}});
}

function fkg(v){return (Math.round(v*10)/10).toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1})}
function weightChart(es){
  if(es.length<2)return '<p class="hint" style="margin:0">Mit zwei Einträgen siehst du hier deine Kurve.</p>';
  var W=520,H=220,L=46,R=10,T=14,B=28,pw=W-L-R,ph=H-T-B,t0=parseKey(es[0].k).getTime(),t1=parseKey(es[es.length-1].k).getTime(),span=Math.max(t1-t0,6*864e5);
  var vs=es.map(function(e){return e.v}),tw=+S.p.tw||null,lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  if(tw&&tw>lo-6&&tw<hi+6){lo=Math.min(lo,tw);hi=Math.max(hi,tw)}
  lo=Math.floor(lo-.8);hi=Math.ceil(hi+.8);
  var x=function(k){return L+(parseKey(k).getTime()-t0)/span*pw},y=function(v){return T+ph-(v-lo)/(hi-lo)*ph};
  var s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gewichtsverlauf">';
  [0,.5,1].forEach(function(f){var v=lo+(hi-lo)*f,yy=y(v);s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/><text class="ax" x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+fkg(v)+'</text>'});
  if(tw&&tw>=lo&&tw<=hi)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(tw)+'" y2="'+y(tw)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="5 4" opacity=".7"/>';
  s+='<path d="M'+es.map(function(e){return x(e.k).toFixed(1)+' '+y(e.v).toFixed(1)}).join('L')+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  es.forEach(function(e){s+='<circle cx="'+x(e.k).toFixed(1)+'" cy="'+y(e.v).toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface2)" stroke-width="2"/>'});
  s+='<text class="ax" x="'+L+'" y="'+(H-8)+'">'+dmy(parseKey(es[0].k))+'</text><text class="ax" x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+dmy(parseKey(es[es.length-1].k))+'</text></svg>';
  return '<div class="chartbox">'+s+'</div><div class="legend"><span><i style="background:var(--accent)"></i>Dein Gewicht</span>'+(tw&&tw>=lo&&tw<=hi?'<span><i class="ln"></i>Zielgewicht</span>':'')+'</div>';
}

async function genPlan(onlyMissing){
  var g=S.tgen;if(g.busy)return;
  var hasPlan=!!(S.tplan&&Object.keys(S.tplan.sessions||{}).length);
  if(!onlyMissing&&hasPlan){
    if(!S.premium&&(S.tchanges||0)>=2){S.tlimit=true;render();window.scrollTo(0,0);return}
    S.tchanges=(S.tchanges||0)+1;S.tlimit=false;save();
  }
  var sample=await getSample();g.err='';var noAI=!sample;
  var days=trainDays();if(!days.length){g.err='Du hast keinen Trainingstag gewählt.';render();return}
  var pl=(onlyMissing&&S.tplan)?S.tplan:{start:keyOf(today(0)),sig:sigOf(),sessions:{},ov:null,ts:Date.now()};
  S.tplan=pl;pl.sig=sigOf();
  var jobs=[];
  if(!pl.ov)jobs.push({ov:true});
  days.forEach(function(d){if(!pl.sessions[d])jobs.push({d:d})});
  // Tage, die nicht mehr im Wochenplan sind, entfernen
  Object.keys(pl.sessions).forEach(function(k){if(days.indexOf(k)<0)delete pl.sessions[k]});
  if(!jobs.length){save();render();return}
  g.busy=true;g.total=jobs.length;g.done=0;g.fail=0;g.local=0;render();
  var so={cache:false};if(sample&&sample.shim)so.mode='train';
  async function run(j){
    if(noAI){var f0=j.ov?localOverview():localSession(j.d);if(f0){if(j.ov)pl.ov=f0;else pl.sessions[j.d]=f0;g.local=(g.local||0)+1;save();return true}g.lastErr={code:'none'};return false}
    for(var a=0;a<3;a++){
      try{
        var o=await sample.json(j.ov?overviewPrompt():sessionPrompt(j.d),so);
        if(j.ov){var ov=normOverview(o);if(!ov)throw {code:'invalid_json'};pl.ov=ov}
        else{var s=normSession(o,j.d);if(!s)throw {code:'invalid_json'};pl.sessions[j.d]=s}
        save();return true;
      }catch(e){
        if(aiDown(e)||a===2){
          var fb=j.ov?localOverview():localSession(j.d);
          if(fb){if(j.ov)pl.ov=fb;else pl.sessions[j.d]=fb;g.local=(g.local||0)+1;g.lastErr=e;save();return true}
          g.lastErr=e;return false}
        await new Promise(function(r){setTimeout(r,1500*(a+1))})}
    }
  }
  var idx=0;
  async function worker(){while(idx<jobs.length){var j=jobs[idx++],ok=await run(j);g.done++;if(!ok)g.fail++;if(S.view==='train')render()}}
  try{await Promise.all([worker(),worker()])}
  finally{
    g.busy=false;
    if(g.fail)g.err=errCopy(g.lastErr)+' '+g.fail+' Teil(e) fehlen noch.';
    else if(g.local&&noAI)g.err='Die KI ist noch nicht eingerichtet. Dein Plan wurde deshalb aus der geprüften Übungsliste erstellt (passend zu Ort, Geräten, Level und Dauer, aber ohne persönliche Erklärungen). Sobald dein KI-Server steht, kannst du ihn in den Einstellungen neu erstellen lassen.';
    else if(g.local)g.err=g.local+' Teil(e) hat die KI nicht brauchbar beantwortet (Grund: '+errCopy(g.lastErr).replace(/\.$/,'')+'). Sie wurden stattdessen aus der geprüften Übungsliste erstellt. Über Einstellungen kannst du den Plan neu erstellen, dann versucht es die KI noch einmal.';
    save();if(S.view==='train')render();
  }
}

      det='<div class="card caldet"><div class="cd-h"><div><b>'+esc(dateLong(sel))+'</b><small>Woche '+w2+'</small></div></div>';

        det+='<h3 style="margin:10px 0 2px">'+esc(inf2.s.titel)+'</h3><small class="hint">'+inf2.s.min+' min · ca. '+inf2.s.kcal+' kcal'+'</small><ul class="plain" style="margin-top:8px">'+inf2.s.ex.map(function(e){return '<li><b>'+esc(e.n)+'</b> · '+e.sets+' × '+esc(e.wdh)+'</li>'}).join('')+(inf2.s.cardio?'<li><b>'+esc(inf2.s.cardio.n)+'</b> · '+inf2.s.cardio.min+' min</li>':'')+'</ul>'+logSummary(sel)+
         '<button type="button" class="btn full'+(S.tdone[sel]?'':' pri')+'" style="margin-top:12px" data-act="tdonetoggle" data-k="'+sel+'"'+(can?'':' disabled')+'>'+(S.tdone[sel]?'Als erledigt markiert · rückgängig':can?'Als erledigt markieren':'Noch nicht an der Reihe')+'</button>';
      }
      det+='</div>';
    }
  }
  return '<p class="sub" style="margin:0 0 12px">Jede Zeile ist eine Woche. Tippe auf einen Tag, um die Einheit zu sehen und abzuhaken. Der Plan läuft ohne festes Ende weiter, solange du Premium hast. Gestartet am '+dmy(st)+'</p>'+top+cells+leg+det;
}

      c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL('image/jpeg',.8))};im.src=fr.result};

  var SHOW=ps.length>40?.35:ps.length>20?.55:.9,FADE=Math.min(.4,SHOW*.45),END=2.4;

    function pic(im,a){if(!im||!im.width)return;var s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;cx.globalAlpha=a;cx.drawImage(im,(W-w)/2,(H-h)/2,w,h);cx.globalAlpha=1}

    }else{

      pic(imgs[imgs.length-1],1);cx.fillStyle='rgba(8,14,12,'+(.55+.3*q)+')';cx.fillRect(0,0,W,H);
      cx.textAlign='center';cx.fillStyle='#fff';cx.font='800 30px system-ui,sans-serif';cx.globalAlpha=q;
      cx.fillText(dw!=null&&Math.abs(dw)>=.05?(dw<0?'−':'+')+fmt1(Math.abs(dw))+' kg':'Weiter so!',W/2,H/2-6);
      cx.font='600 17px system-ui,sans-serif';cx.fillStyle='#8be3c4';cx.fillText(days>0?'in '+days+(days===1?' Tag':' Tagen'):'',W/2,H/2+26);
      cx.font='500 14px system-ui,sans-serif';cx.fillStyle='#cfe';cx.fillText(ps.length+' Fotos',W/2,H/2+52);cx.globalAlpha=1;

  var rec=null,chunks=[];

function arHash(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

function arFoodCount(k){return (S.log[k]||[]).filter(function(i){return !isDrink(i)}).length}
function arBase(k){
  var n=Math.min(10,arFoodCount(k)),a=S.arena,lk=a.locks;
  var r={food:n*EP.food,train:S.tdone&&S.tdone[k]?EP.train:0,goal:lk[k+'|goal']?EP.goal:0,water:lk[k+'|water']?EP.water:0,slots:n};
  r.sum=r.food+r.train+r.goal+r.water;return r;
}
function arDay(k){var r=arBase(k),bo=(S.arena.bonus&&S.arena.bonus[k])||0;r.bonus=bo;r.sum+=bo;return r}
function arWeekDays(wk){var out=[],d0=parseKey(wk);for(var i=0;i<7;i++){var d=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+i,12);out.push(keyOf(d))}return out}
function arWeekEP(wk){return arWeekDays(wk).reduce(function(a,k){return a+arDay(k).sum},0)}
/* Tagesziele fest eintragen, sobald erreicht */
function arCheck(){

  [yd,td].forEach(function(k){

    var st=dayStats(items),tg=S.tg[k],target=tg?tg.k:(function(){try{return calc(S.p,S.p.perMonth).target}catch(e){return 0}})();
    var slots={};items.forEach(function(i){if(!isDrink(i))slots[i.meal]=1});
    if(!a.locks[k+'|goal']&&target>0&&st.k>=target*.9&&st.k<=target*1.05&&Object.keys(slots).length>=2){a.locks[k+'|goal']=1;ch=true;toast('Tagesziel erreicht: +'+EP.goal+' EP')}
    if(!a.locks[k+'|water']&&st.water>=waterGoal(S.p)){a.locks[k+'|water']=1;ch=true;toast('Wasserziel erreicht: +'+EP.water+' EP')}

var BOOST_MS=5*60000;
function arSlots(k){var sl={};(S.log[k]||[]).forEach(function(i){if(!isDrink(i)&&i.meal)sl[i.meal]=1});return Object.keys(sl).length}
function arWater(k){return dayStats(S.log[k]||[]).water}

var QPOOL=[
 {id:'meals3',g:'d',t:'Trage heute 3 Essen ein',pr:function(k){return [arFoodCount(k),3]}},
 {id:'meals5',g:'d',t:'Trage heute 5 Essen ein',pr:function(k){return [arFoodCount(k),5]}},

/* Vier Quests pro Tag, fest nach Datum und Spieler gewürfelt: drei Aufgaben mit Daten, eine zum Entdecken der App */
function arQuests(k){
  var r=arRng(arHash(S.arena.pid+'|'+k)),d=QPOOL.filter(function(x){return x.g==='d'}),v=QPOOL.filter(function(x){return x.g==='v'}),out=[];
  var fixed=['meals3','meals5'];
  [d,v].forEach(function(l,gi){var n=gi?1:3,pool=l.slice();
    for(var i=0;i<n&&pool.length;i++){var j=Math.floor(r()*pool.length);out.push(pool.splice(j,1)[0])}});
  /* nicht zwei Essens-Quests gleichzeitig */
  var seen=0;out=out.filter(function(x){if(fixed.indexOf(x.id)>-1){seen++;return seen<2}return true});
  var rest=d.filter(function(x){return out.indexOf(x)<0&&fixed.indexOf(x.id)<0});
  while(out.length<4&&rest.length)out.push(rest.splice(Math.floor(r()*rest.length),1)[0]);
  return out;
}
function arQDone(k,q){var a=S.arena;if(a.qdone[k+'|'+q.id])return true;var p=q.pr(k);return p[0]>=p[1]}
function arBoostLeft(){return Math.max(0,(S.arena&&S.arena.boostUntil||0)-Date.now())}
/* Wird bei jedem Zeichnen aufgerufen: Besuche merken, EP mit Boost verdoppeln, Quests prüfen */
function arTick(){
  if(!S.done)return;
  arInit();var a=S.arena,td=keyOf(today(0)),ch=false,now=Date.now();
  if(['history','eagle','train'].indexOf(S.view)>-1&&!a.vis[td+'|'+S.view]){a.vis[td+'|'+S.view]=1;ch=true}
  arCheck();
  /* Boost: EP, die jetzt dazukamen, zählen doppelt, solange der Boost läuft */
  var base=arBase(td).sum;
  if(!a.snap||a.snap.k!==td){a.snap={k:td,v:base};ch=true}
  else if(base!==a.snap.v){if(base>a.snap.v&&a.boostUntil>now)a.bonus[td]=(a.bonus[td]||0)+(base-a.snap.v);a.snap.v=base;ch=true}
  /* Quests */
  arQuests(td).forEach(function(q){
    if(a.qdone[td+'|'+q.id])return;var p=q.pr(td);
    if(p[0]>=p[1]){a.qdone[td+'|'+q.id]=1;a.boostUntil=Math.max(now,a.boostUntil)+BOOST_MS;ch=true;toast('Quest geschafft! 5 Minuten doppelte EP')}
  });
  var ks=Object.keys(a.qdone);if(ks.length>120){ks.sort().slice(0,ks.length-120).forEach(function(x){delete a.qdone[x]})}
  var vk=Object.keys(a.vis);if(vk.length>60){vk.sort().slice(0,vk.length-60).forEach(function(x){delete a.vis[x]})}
  if(ch)save();
}

/* Bots: Wochenleistung hängt von der Liga ab, Fortschritt läuft über die Woche */
var ARB=[[200,110],[270,110],[340,115],[410,120],[480,125],[560,130]];
function arBot(tid,j,league,wk,nowTs){
  var r=arRng(arHash(tid+'|'+j)),nm=BOTN[Math.floor(r()*BOTN.length)]+(r()<.5?BOTT[Math.floor(r()*BOTT.length)]:''),
      base=ARB[league][0]+(r()*2-1)*ARB[league][1],ep=0,d0=parseKey(wk),now=nowTs||Date.now();
  var rw=arRng(arHash(tid+'|'+j+'|'+wk));
  for(var d=0;d<7;d++){
    var day=new Date(d0.getFullYear(),d0.getMonth(),d0.getDate()+d,0,0,0).getTime(),
        v=Math.max(0,Math.round(base/7*(.35+rw()*1.3)/5)*5),f=clamp((now-day)/86400000,0,1);
    ep+=Math.round(v*Math.min(1,f*1.15)/5)*5;
  }
  return {name:nm,ep:ep,bot:true,id:'b'+j};
}
function arTid(){var a=S.arena;return a.league+'-'+(arHash(a.pid)%9+1)}
/* Tabelle: echte Spieler (vom Server, falls eingerichtet) plus Bots auf freien Plätzen */
function arTable(wk,league,tid,humans,myEP){
  var a=S.arena,rows=[{id:a.pid,name:a.name,ep:myEP,me:true}],seen={};seen[a.pid]=1;
  (humans||[]).forEach(function(h){if(h&&h.id&&!h.me&&!seen[h.id]&&rows.length<10){seen[h.id]=1;rows.push({id:h.id,name:String(h.name||'Spieler').slice(0,16),ep:+h.ep||0,human:true})}});
  var j=0,used={};while(rows.length<10&&j<40){var b=arBot(tid,j,league,wk);j++;if(used[b.name]||rows.some(function(x){return x.name===b.name}))continue;used[b.name]=1;rows.push(b)}
  var now=wk===arWeekKey()?Date.now():parseKey(wk).getTime()+8*86400000;
  rows.forEach(function(x){if(x.bot)x.ep=arBot(tid,+x.id.slice(1),league,wk,now).ep});
  rows.sort(function(p,q){return q.ep-p.ep||(p.me?1:0)-(q.me?1:0)||(p.bot?1:0)-(q.bot?1:0)});
  rows.forEach(function(x,i){x.rank=i+1});
  return rows;
}
function arZone(rank){return rank<=3?'up':rank<=7?'stay':'down'}
/* Wochenwechsel: Platz 1 bis 3 steigt auf, 4 bis 7 bleibt, 8 bis 10 steigt ab */
function arRoll(){
  arInit();var a=S.arena,cur=arWeekKey(),n=0;
  while(a.week<cur&&n<8){
    var wk=a.week,ep=arWeekEP(wk),tid=a.league+'-'+(arHash(a.pid)%9+1);
    var humans=(S.arenaNet&&S.arenaNet.week===wk&&S.arenaNet.league===a.league)?S.arenaNet.humans:[];
    var rows=arTable(wk,a.league,(S.arenaNet&&S.arenaNet.week===wk&&S.arenaNet.tid)||tid,humans,ep),me=rows.filter(function(x){return x.me})[0],z=arZone(me.rank),old=a.league,nl=old;
    if(z==='up')nl=Math.min(LEAGUES.length-1,old+1);else if(z==='down')nl=Math.max(0,old-1);
    var res={week:wk,league:old,rank:me.rank,ep:ep,zone:z,to:nl};
    a.hist.unshift(res);a.hist=a.hist.slice(0,20);a.last=res;a.league=nl;
    var d=parseKey(wk);a.week=keyOf(new Date(d.getFullYear(),d.getMonth(),d.getDate()+7,12));n++;
    S.arenaNet=null;
  }
  if(a.week<cur)a.week=cur;
  if(n)save();
}
/* Optionaler Server: echte Spieler. Ohne Server bleibt die Tabelle bei Bots. */
function arApi(){var api=window.MAHLZEIT_API;return (api&&/^https?:\/\//.test(api)&&api.indexOf('DEIN-WORKER')<0)?api.replace(/\/$/,''):null}

function toB64(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var m=1280,sc=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement('canvas');
      cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);res(cv.toDataURL('image/jpeg',.82).split(',')[1]);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej({code:'image_rejected'})};img.src=url;
  });
}
function makeShim(url){
  async function call(input,o){
    o=o||{};var msgs=typeof input==='string'?[{role:'user',content:input}]:input,img=null;
    if(o.images)img=await toB64(o.images);
    var res;
    try{res=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:msgs,image:img,quick:o.modelTier==='quick',mode:o.mode||''}),signal:o.signal})}
    catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network'}}
    var j=null;try{j=await res.json()}catch(e){}
    if(res.status===429||(j&&j.error==='rate_limited'))throw {code:'rate_limited'};
    if(!res.ok)throw {code:(j&&j.error)||('http_'+res.status),status:(j&&j.status)||res.status};
    if(!j)throw {code:'bad_response'};
    var text=String(j.text||'');
    if(!text.trim())throw {code:'empty_completion'};
    if(o.onText)o.onText({text:text,delta:text});
    return {text:text};
  }
  var f=async function(i,o){return call(i,o)};
  f.json=async function(i,o){
    var r=await call(i,o),t=r.text,a=t.indexOf('{'),b=t.lastIndexOf('}');
    if(a<0||b<a)throw {code:'invalid_json',text:t};
    try{return JSON.parse(t.slice(a,b+1))}catch(e){throw {code:'invalid_json',text:t}}
  };
  f.shim=true;
  f.limits=async function(){return {images:true}};
  return f;
}

  case 'opentrain':SPD=null;TRK.train=undefined;S.view='train';if(S.train.done===false&&!S.train.step)S.train.step=0;save();render();window.scrollTo(0,0);break;

  case 'genmissing':genPlan(true);break;
  case 'tcal':S.tsel=t.dataset.k;render();break;
  case 'tdonetoggle':var dk0=t.dataset.k;if(dk0>keyOf(today(0)))break;if(S.tdone[dk0])delete S.tdone[dk0];else S.tdone[dk0]=1;save();render();break;
  case 'tday':SPD=SPD===t.dataset.d?null:t.dataset.d;updateSplit();break;

    sp2[t.dataset.d]=dv;save();updateSplit();break;
  case 'tavoid':var av=S.train.avoid||(S.train.avoid=[]),ai=av.indexOf(t.dataset.v);if(ai>-1)av.splice(ai,1);else av.push(t.dataset.v);save();updateAvoid();break;
  case 'tcustom':var cu=String(S.train.q||'').trim();if(cu){var av2=S.train.avoid||(S.train.avoid=[]);if(av2.indexOf(cu)<0)av2.push(cu);S.train.q='';save();updateAvoid();var ts=document.getElementById('tsearch');if(ts){ts.value='';ts.focus()}}break;
  case 'tnext':var tl=tqList(),tq2=tl[S.train.step];if(!tAnswered(tq2))break;if(S.train.step<tl.length-1)S.train.step++;else S.train.done=true;save();render();window.scrollTo(0,0);break;
  case 'tback':if(S.train.step>0)S.train.step--;else S.view='result';save();render();window.scrollTo(0,0);break;
  case 'tedit':SPD=null;TRK.train=undefined;S.train.done=false;S.train.step=0;S.train.q='';save();render();window.scrollTo(0,0);break;
  case 'openpremium':openSheet(null,'premium');break;
  case 'subscribe':toast('Bezahlen ist in dieser Version noch nicht möglich. Nutze den Code.');break;
  case 'redeem':if(sh){if(String(sh.pcode||'').trim()===PREMIUM_CODE){S.premium=true;save();closeSheet();toast('Premium ist freigeschaltet');render()}else{sh.pmsg='Der Code stimmt nicht. Prüfe ihn und versuche es noch einmal.';renderSheet();var pc=document.getElementById('pcode');if(pc)pc.focus()}}break;
  case 'unpremium':S.premium=false;save();closeSheet();render();break;
  case 'opendrink':openSheet(null,'drink');break;
  case 'qdrink':var qd=drinkById(t.dataset.id);addDrink(qd,+t.dataset.ml);toast('+'+t.dataset.ml+' ml '+qd.n);render();break;
  case 'dpick':if(sh){sh.dk=t.dataset.v;sh.ml=String(drinkById(sh.dk).sz[1]||250);renderSheet()}break;

  case 'adddrink':if(sh){var ml=num(sh.ml);if(!(ml>0)){toast('Bitte eine Menge eingeben');break}var dk=drinkById(sh.dk);addDrink(dk,ml);toast('Hinzugefügt: '+fmt(ml)+' ml '+dk.n);closeSheet();render()}break;
  case 'day':S.day=t.dataset.k;S.gen.err='';renderPlan();break;
  case 'gen':generate();break;
  case 'swap':swapDish(+t.dataset.i);break;
  case 'stop':if(S.gen.ctl)S.gen.ctl.abort();break;
  case 'dishlog':var d=(S.plans[S.day]||{dishes:[]}).dishes[+t.dataset.i];if(d){addItem(mapMeal(d.slot),d.name,null,d.kcal,d.protein,d.carbs,d.fett,d.score);toast('Eingetragen: '+d.name);render()}break;
  case 'openmeal':openSheet(t.dataset.m,'menu');break;
  case 'openrecipe':openSheet(null,'recipes');break;
  case 'openchat':go('ai');break;
  case 'gotoai':closeSheet();go('ai');break;
  case 'hmetric':S.hist.metric=t.dataset.v;render();break;
  case 'hrange':S.hist.range=+t.dataset.v;render();break;
  case 'htable':S.hist.table=!S.hist.table;render();break;
  case 'toggleweek':S.hist.opened[t.dataset.k]=!S.hist.opened[t.dataset.k];render();break;
  case 'weekai':weekAI(t.dataset.k);break;
  case 'weeksToggle':S.hist.weeksOpen=!S.hist.weeksOpen;render();break;
  case 'openweek':S.hist.weeksOpen=true;S.hist.opened[t.dataset.k]=true;S.hview='food';go('history');break;
  case 'aiclear':S.aichat.msgs=[];save();render();break;
  case 'delitem':e.stopPropagation();var key=keyOf(today(0));S.log[key]=(S.log[key]||[]).filter(function(x){return x.id!==t.dataset.id});save();render();break;
  case 'closesheet':closeSheet();break;
  case 'sheetback':
    if(!sh)break;
    if(sh.view==='weight')sh.view='search';
    else if(sh.view==='search')sh.view=sh.ing?'recipenew':'menu';
    else if(sh.view==='recipenew'){sh.ing=false;sh.view='recipes'}
    else if(sh.view==='recweight')sh.view='recipes';
    else sh.view='menu';
    renderSheet();break;
  case 'goview':if(sh){sh.view=t.dataset.v;renderSheet()}break;
  case 'mealsel':if(sh){sh.mealSel=t.dataset.v;document.querySelectorAll('[data-act=mealsel]').forEach(function(b){b.classList.toggle('on',b.dataset.v===sh.mealSel)})}break;
  case 'pickfood':if(sh){sh.food=FOODS.filter(function(f){return f.name===t.dataset.n})[0];sh.g=sh.food.u?sh.food.u:100;sh.view='weight';renderSheet()}break;
  case 'aiest':aiEstimate();break;
  case 'setg':if(sh){sh.g=t.dataset.g;var gi=document.getElementById('g');if(gi)gi.value=sh.g;updateWprev()}break;
  case 'addfood':
    if(!sh)break;var g=num(sh.g);if(!(g>0)){toast('Bitte ein Gewicht eingeben');break}var f=sh.food;
    if(sh.ing){sh.recipe.ings.push({name:f.name,g:g,s:foodScore(f),k:f.k*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100});sh.ing=false;sh.view='recipenew';renderSheet();break}
    var bi={meal:sh.mealSel,name:f.name,g:g,k:f.k*g/100,p:f.p*g/100,c:f.c*g/100,f:f.f*g/100,s:foodScore(f)};if(sh.photo){bi.ph=sh.photo;sh.photo=null}sh.basket.push(bi);toast('In der Auswahl: '+f.name);sh.q='';sh.view='search';renderSheet();break;
  case 'recnew':if(sh){sh.recipe={name:'',portions:'2',ings:[]};sh.view='recipenew';renderSheet()}break;
  case 'recaddingr':if(sh){sh.ing=true;sh.q='';sh.view='search';renderSheet()}break;
  case 'recdeling':if(sh){sh.recipe.ings.splice(+t.dataset.i,1);renderSheet()}break;
  case 'recsave':
    if(!sh)break;var r=sh.recipe,tot=sums(r.ings),po=Math.max(1,Math.round(num(r.portions)||1));
    S.recipes.push({id:uid(),name:r.name.trim(),portions:po,score:avgScore(r.ings),per:{k:tot.k/po,p:tot.p/po,c:tot.c/po,f:tot.f/po}});save();toast('Rezept gespeichert');sh.view='recipes';renderSheet();break;
  case 'recdel':if(sh){S.recipes.splice(+t.dataset.i,1);save();renderSheet()}break;
  case 'recuse':if(sh){sh.rec=S.recipes[+t.dataset.i];sh.por='1';sh.view='recweight';renderSheet()}break;
  case 'addrec':
    if(!sh)break;var po2=num(sh.por||'1');if(!(po2>0)){toast('Bitte Portionen eingeben');break}var rc=sh.rec;
    sh.basket.push({meal:sh.mealSel,name:rc.name+(po2!==1?' ('+po2.toLocaleString('de-DE')+' Portionen)':''),g:null,k:rc.per.k*po2,p:rc.per.p*po2,c:rc.per.c*po2,f:rc.per.f*po2,s:rc.score});toast('In der Auswahl: '+rc.name);sh.view='menu';renderSheet();break;
  case 'phclear':if(sh){sh.photo=null;renderSheet()}break;
  case 'scangal':var gi=document.getElementById(t.dataset.i);if(gi){gi.value='';gi.click()}break;
  case 'scanfood':case 'scanbc':var sid=a==='scanfood'?'phfood':'bcfile';camAsk(function(){var pi=document.getElementById(sid);if(pi){pi.value='';pi.click()}});break;
  case 'bcstop':if(sh){stopCam();sh.scan.status='idle';sh.scan.err='';renderScan()}break;
  case 'bcreset':if(sh){stopCam();sh.scan={status:'idle',items:[],err:'',preview:'',hint:''};renderScan()}break;
  case 'bcgo':if(sh){var bn=document.getElementById('bcnum'),bv=bn?bn.value.replace(/\s/g,''):'';if(!/^\d{8,14}$/.test(bv)){sh.scan.status='error';sh.scan.err='Die Nummer hat 8 bis 14 Ziffern. Prüfe die Zahl unter dem Barcode.';renderScan();break}bcHandle(bv)}break;

  case 'bdel':if(sh){sh.basket.splice(+t.dataset.i,1);renderSheet()}break;

function onInput(e){
  var t=e.target;
  if(t.dataset&&t.dataset.lg){logInput(t);return}
  if(t.dataset&&t.dataset.rkf){S.rk[t.dataset.rkf]=t.value;if(S.rk.msg){S.rk.msg='';var nm=document.querySelector('.rkcard .note');if(nm)nm.remove()}return}
  if(t.dataset&&t.dataset.arf==='name'&&S.arena){S.arena.name=t.value.slice(0,16)||'Spieler';save();return}
  if(t.id==='tsearch'){S.train.q=t.value;updateAvoid();return}
  if(t.id==='egname'){S.eagle.name=t.value.slice(0,14);save();return}
  if(t.id==='pcode'&&S.sheet){S.sheet.pcode=t.value;if(S.sheet.pmsg){S.sheet.pmsg='';var nn=document.querySelector('#sheet .note');if(nn)nn.remove()}return}
  if(t.id==='ml'&&S.sheet){S.sheet.ml=t.value;updateWprev();return}
  if(t.id==='q'&&S.sheet){S.sheet.q=t.value;var r=document.getElementById('results');if(r)r.innerHTML=foodRows(t.value);return}
  if(t.id==='g'&&S.sheet){S.sheet.g=t.value;updateWprev();return}
  if(t.id==='por'&&S.sheet){S.sheet.por=t.value;updateWprev();return}
  if(t.dataset&&t.dataset.rk&&S.sheet){S.sheet.recipe[t.dataset.rk]=t.value;var b=document.querySelector('[data-act=recsave]');if(b)b.disabled=!(S.sheet.recipe.ings.length&&S.sheet.recipe.name.trim());return}
  if(t.dataset&&t.dataset.sg!==undefined&&S.sheet){var it=S.sheet.scan.items[+t.dataset.sg];it.g=t.value;var sk=document.getElementById('sk'+t.dataset.sg);if(sk)sk.textContent=fmt(it.pk*(num(t.value)||0))+' kcal';var st=document.getElementById('stot');if(st)st.innerHTML=pillsHtml(scanSum(S.sheet.scan));return}
  var k=t.dataset&&t.dataset.key;if(!k||S.view!=='wizard')return;
  if(k==='perMonth'){S.p.perMonth=+t.value;updateAmount()}else S.p[k]=t.value;
  if(k==='tw'){var tn=document.getElementById('twNote');if(tn)tn.innerHTML=twNote()}
  if(k==='age'){var an=document.getElementById('ageNote');if(an)an.innerHTML=ageNote()}
  updateNav();save();
}
app.addEventListener('click',onClick);
sheetEl.addEventListener('click',function(e){if(e.target===sheetEl){closeSheet();return}onClick(e)});
app.addEventListener('change',function(ev){var tg=ev.target;if((tg.id==='phfile'||tg.id==='phgal')&&tg.files&&tg.files[0])phAdd(tg.files[0])});
app.addEventListener('input',onInput);sheetEl.addEventListener('input',onInput);
sheetEl.addEventListener('change',function(e){
  var tg=e.target;
  if((tg.id==='bcfile'||tg.id==='bcfileg')&&tg.files&&tg.files[0]){var bf=tg.files[0],bsh=S.sheet;if(bsh){bsh.scan.status='busy';bsh.scan.msg='Ich suche den Barcode im Foto …';renderScan();bcFromFile(bf).then(function(c){if(S.sheet!==bsh)return;if(c)bcHandle(c);else{bsh.scan.status='error';bsh.scan.err='Ich konnte keinen Barcode im Foto lesen. Halte die Kamera näher und gerade und achte auf gutes Licht.';renderScan()}}).catch(function(){if(S.sheet!==bsh)return;bsh.scan.status='error';bsh.scan.err='Das Foto konnte ich nicht öffnen.';renderScan()})}return}
  if((tg.id==='phfood'||tg.id==='phfoodg')&&tg.files&&tg.files[0]){var psh=S.sheet;photoThumb(tg.files[0]).then(function(u){if(S.sheet!==psh)return;psh.photo=u;psh.q='';psh.view='search';renderSheet()}).catch(function(){toast('Das Foto konnte ich nicht öffnen.')});return}
if(e.target.id==='photo'&&e.target.files&&e.target.files[0])startScan(e.target.files[0])});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='pcode'){e.preventDefault();var b=document.querySelector('[data-act=redeem]');if(b)b.click();return}
  if(e.key==='Enter'&&e.target.id==='wkg'){e.preventDefault();saveWeight();return}
  if(e.key==='Enter'&&e.target.id==='cin'){e.preventDefault();var v=e.target.value;e.target.value='';aiSend(v);return}
  if((e.key==='Enter'||e.key===' ')&&e.target.getAttribute&&e.target.getAttribute('role')==='button'&&e.target.dataset.act){e.preventDefault();e.target.click()}
  if(e.key==='Escape'&&S.sheet)closeSheet();
});
/* Wischen auf der Startseite: Start <-> Adler */
var tx0=0,ty0=0,tOk=false;
document.addEventListener('touchstart',function(e){var t=e.touches[0];tx0=t.clientX;ty0=t.clientY;tOk=!S.sheet&&(S.view==='welcome'||S.view==='result'||S.view==='eagle'||S.view==='history'||(S.view==='train'&&(!S.premium||S.train.done)))&&!e.target.closest('.dtabs,.days,.dq,.looks,.seg,.tblwrap,#hsvg,input,.num,.text')},{passive:true});
document.addEventListener('touchend',function(e){
  if(!tOk)return;var t=e.changedTouches[0],dx=t.clientX-tx0,dy=t.clientY-ty0;
  if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){
    var ti=S.done?TABS.map(function(x){return x[0]}).indexOf(S.view):-1;
    if(ti>-1){var ni=ti+(dx<0?1:-1);if(ni<0||ni>=TABS.length)return;S.view=TABS[ni][0]}
    else if(S.view==='eagle'){S.view=S.done?'result':(S.prev==='wizard'?'wizard':'welcome')}else{S.prev=S.view;S.view='eagle'}
    render();window.scrollTo(0,0);
  }
},{passive:true});

function hov(e){if(e.target.id==='hit'){if(e.type==='pointerleave'&&e.pointerType!=='mouse')return;showTip(e.clientX)}}
app.addEventListener('pointermove',hov);app.addEventListener('pointerdown',hov);
app.addEventListener('pointerout',function(e){if(e.target.id==='hit'&&e.pointerType==='mouse')hideTip()});
load();applyTheme();render();
})();
